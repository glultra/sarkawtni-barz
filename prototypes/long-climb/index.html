<script>
'use strict';
// Long Climb in 3D: thirty levels wound round one tower, in a tall 9:16 window. Every ledge is
// one-way: you rise through it from below and land on its top, so a miss drops you to whatever
// is underneath. The camera swings round the tower by itself; there is no mouse to steer.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 720, H = 1280;        // logical size: a phone held upright, as TikTok shows it
const FONT = '"Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", sans-serif';
const TITLE = 'Long Climb';
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function fixedRng(s) { // the tower's own generator: the same seed lays the same ledges for everyone
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const events = []; // window.game.events: anything the game wants a run to see
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI;

// ---- Words: Sorani Kurdish, right to left -------------------------------------------------
const K = {
  title: 'سەرکەوتنی درێژ',
  tagline: 'سی ئاست، یەک تاوەر، یەک هەڵە و دەکەویتە خوارەوە',
  controls: ['W A S D یان تیرەکان: جووڵە', 'Space: باز (بۆ بازی بەرزتر دایبگرە)', 'R دابگرە: دەستپێکردنەوە     P: وەستان     M: بێدەنگ', 'C: پشکنینی کۆدی بینەر'],
  start: 'Enter یان دەست لێدان بۆ دەستپێکردن', cont: 'B: بەردەوامبوون لە ئاستی',
  pick: 'ئاستی سەختی (تیرەکان یان 1 2 3)', modes: ['ئاسان', 'ئاسایی', 'سەخت'],
  height: 'بەرزی', time: 'کات', falls: 'کەوتن', best: 'باشترین', metre: 'م', level: 'ئاستی', next: 'جیهانی نوێ',
  paused: 'وەستاوە', resume: 'P بۆ بەردەوامبوون', holdR: 'R دابگرە بۆ دەستپێکردنەوە', wind: 'با',
  summit: 'گەیشتیتە لووتکە!', yourCode: 'کۆدەکەت', sendCode: 'ئەم کۆدە بنێرە بۆ سەلماندنی کاتەکەت', again: 'Enter بۆ دووبارە سەرکەوتن',
  codeTitle: 'پشکنینی کۆدی بینەر', codeAsk: 'کۆدەکە بنووسە و Enter لێبدە', codeBad: 'کۆدەکە هەڵەیە', codeOk: 'کۆدەکە دروستە',
  viewerTime: 'کاتی بینەر', yourTime: 'کاتی تۆ', viewerWins: 'بینەر بردیەوە!', youWin: 'تۆ بردتەوە', noTime: 'تۆ هێشتا ئەم ئاستی سەختییەت تەواو نەکردووە', back: 'Esc بۆ گەڕانەوە',
  bestTime: 'باشترین کات', figures: ['سەرکەوتوو', 'سەکۆ', 'سەکۆی جووڵاو', 'بەرزکەرەوە', 'سەکۆی داڕماو', 'سەهۆڵ', 'هەڵبەزێنەر', 'پشتێنی گوازەرەوە', 'وێستگەی زێڕین', 'تۆپی سوور'],
};
// Six worlds of five levels: the sky, the cap colour of plain ledges, what the world adds, and its tune.
const WORLDS = [
  { name: 'باخچە', sky: 0x9adcff, fog: 0xcfeeff, cap: 0x6fcf5a, pillar: 0xf6e9c8, mix: {}, scale: [0, 2, 3.5, 5, 7, 9, 10.5], root: 220, bpm: 96 },
  { name: 'هەورەکان', sky: 0xbfe2ff, fog: 0xeef6ff, cap: 0xffffff, pillar: 0xdfeaff, mix: { m: 0.3, l: 0.1 }, scale: [0, 1.5, 3, 5, 7, 8, 10], root: 196, bpm: 104 },
  { name: 'ئێوارە', sky: 0xffa26e, fog: 0xffd2a8, cap: 0xffb347, pillar: 0xffd9b0, mix: { c: 0.35, m: 0.12 }, wind: true, scale: [0, 1, 3, 5, 7, 8, 10], root: 233, bpm: 112 },
  { name: 'سەهۆڵ', sky: 0xa9e4ff, fog: 0xe6f8ff, cap: 0xe8fbff, pillar: 0xcfefff, mix: { i: 0.55, m: 0.15, l: 0.08 }, scale: [0, 2, 3, 5, 7, 8, 11], root: 247, bpm: 100 },
  { name: 'کارگەی شەو', sky: 0x4a3f9a, fog: 0x6a5fc0, cap: 0x9a8cff, pillar: 0x8a7fd0, mix: { b: 0.16, v: 0.28, m: 0.14, l: 0.1 }, scale: [0, 1, 4, 5, 7, 8, 10], root: 262, bpm: 120 },
  { name: 'ئەستێرەکان', sky: 0x101232, fog: 0x1c1e4a, cap: 0xc9d2ff, pillar: 0x4a4f9a, mix: { c: 0.15, i: 0.15, m: 0.15, l: 0.08, b: 0.12, v: 0.14 }, bumpers: true, scale: [0, 1.5, 3, 4, 7, 8, 10], root: 294, bpm: 126 },
];
const LEVELS = 30, PER = 5;

// ---- Screen: a WebGL canvas for the tower, a 2D canvas over it for the words ----------------
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: !CHEAP });
renderer.shadowMap.enabled = false; // the climber carries its own round shadow, which is what tells you where you will land
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H), cw = Math.round(W * k), ch = Math.round(H * k), r = k * (devicePixelRatio || 1);
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px'; stage.style.marginTop = Math.max(0, Math.floor((innerHeight - ch) / 2)) + 'px';
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);

addEventListener('resize', fit); fit();
function text(s, x, y, size, c, align = 'center', bold = false) {
  ctx.direction = 'rtl'; ctx.fillStyle = c; ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function plain(s, x, y, size, c) { ctx.direction = 'ltr'; ctx.fillStyle = c; ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); }
function rr(x, y, w, h, r, fill, stroke, lw = 4) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

// ---- Input: keys by position (event.code), OS key repeat ignored; touch buttons on a phone ---
const down = new Set(), hit = new Set(), typed = [];
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (scene === 'code') { if (e.key.length === 1 || e.key === 'Backspace') typed.push(e.key); e.preventDefault(); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
let touchSeen = params.get('touch') === '1';
const BTN = [ // the phone's buttons: where they sit, and the key each one holds down
  { x: 74, y: H - 176, r: 54, code: 'ArrowLeft' }, { x: 246, y: H - 176, r: 54, code: 'ArrowRight' },
  { x: 160, y: H - 262, r: 54, code: 'ArrowUp' }, { x: 160, y: H - 90, r: 54, code: 'ArrowDown' }, { x: W - 118, y: H - 160, r: 86, code: 'Space' },
];
const fingers = new Map();
function fingerAt(e) { const b = canvas.getBoundingClientRect(); return { x: (e.clientX - b.left) / b.width * W, y: (e.clientY - b.top) / b.height * H }; }
function syncFingers() {
  for (const b of BTN) {
    let on = false;
    for (const f of fingers.values()) if (Math.hypot(f.x - b.x, f.y - b.y) < b.r * 1.2) on = true;
    if (on && !b.on) { down.add(b.code); hit.add(b.code); } else if (!on && b.on) down.delete(b.code);
    b.on = on;
  }
}
canvas.addEventListener('pointerdown', e => {
  startAudio();
  if (e.pointerType === 'touch') touchSeen = true;
  const f = fingerAt(e);
  if (scene === 'title') { // tap a difficulty to pick it, the continue line to go on, anywhere else to start
    if (f.y > 560 && f.y < 650) hit.add(['Digit3', 'Digit2', 'Digit1'][clamp(Math.floor((f.x - 60) / 200), 0, 2)]);
    else if (f.y > 670 && f.y < 730) hit.add('KeyB'); else hit.add('Enter');
  } else if (scene === 'results') hit.add('Enter');
  else if (scene === 'pause') hit.add('KeyP');
  else if (touchSeen) { fingers.set(e.pointerId, f); syncFingers(); }
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => { if (fingers.has(e.pointerId)) { fingers.set(e.pointerId, fingerAt(e)); syncFingers(); } });
for (const n of ['pointerup', 'pointercancel', 'pointerleave']) canvas.addEventListener(n, e => { if (fingers.delete(e.pointerId)) syncFingers(); });

// ---- Audio: sounds and tunes made in code, or your own songs; mute on M -----------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; if (song.el) song.el.muted = m; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  jump: () => tone(330, 0.13, 'triangle', 0.13, 620),
  land: () => tone(140, 0.07, 'triangle', 0.11, 90),
  thud: () => { tone(95, 0.22, 'triangle', 0.3, 45); tone(60, 0.25, 'sine', 0.25, 40); },
  whistle: () => tone(1100, 0.7, 'sine', 0.09, 220),
  bounce: () => tone(220, 0.22, 'square', 0.09, 880),
  crack: () => tone(180, 0.12, 'sawtooth', 0.08, 70),
  bump: () => { tone(160, 0.16, 'square', 0.14, 60); tone(420, 0.1, 'sawtooth', 0.08, 120); },
  rest: () => [523, 659, 784].forEach((f, i) => tone(f, 0.4, 'sine', 0.14, 0, i * 0.09)),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.45, 'triangle', 0.15, 0, i * 0.11)),
  type: () => tone(700, 0.03, 'square', 0.04),
};
// Each world has a tune: your own song when config.js names one, otherwise a short melody the game
// writes itself in that world's scale, over a hand-drum beat.
const song = { world: -1, el: null, beat: 0, acc: 0, phrase: [] };
function playWorld(w) {
  if (song.world === w) return;
  song.world = w; song.beat = 0; song.acc = 0;
  if (song.el) { song.el.pause(); song.el = null; }
  const file = (CONFIG.songs || [])[w];
  if (file) { const el = new Audio(file); el.loop = true; el.volume = tune.music_volume; el.muted = muted; el.play().catch(() => {}); song.el = el; events.push(['song', w + 1, file]); return; }
  const r = fixedRng(500 + w * 31), ph = []; let d = 0;
  for (let i = 0; i < 32; i++) { // a wandering line that comes home at the end of each half
    if (i % 16 === 15) d = 0; else if (r() < 0.72) d = clamp(d + (r() < 0.5 ? -1 : 1) * (r() < 0.8 ? 1 : 2), -2, 8);
    ph.push(r() < 0.18 && i % 4 !== 0 ? null : d);
  }
  song.phrase = ph; events.push(['tune', w + 1]);
}
function stepMusic(dt) {
  if (song.world < 0 || song.el || !audio || muted) return;
  const Wd = WORLDS[song.world], len = 60 / Wd.bpm / 2, v = tune.music_volume;
  song.acc += dt;
  while (song.acc >= len) {
    song.acc -= len; const i = song.beat++ % 32, d = song.phrase[i];
    if (d !== null) { const oct = Math.floor(d / 7), semi = Wd.scale[((d % 7) + 7) % 7] + oct * 12; tone(Wd.root * Math.pow(2, semi / 12), len * 1.7, 'triangle', 0.075 * v); }
    if (i % 8 === 0) tone(Wd.root / 2, len * 7, 'sine', 0.05 * v);                       // a low drone under the line
    const b = i % 8; if (b === 0 || b === 5) tone(92, 0.16, 'sine', 0.2 * v, 50);          // the drum's deep stroke
    else if (b === 2 || b === 3 || b === 6) tone(1500, 0.035, 'square', 0.035 * v, 900);   // and its sharp one

// ---- The 3D world -----------------------------------------------------------------------------
const world = new THREE.Scene();
world.add(new THREE.HemisphereLight(0xffffff, 0x8a8f98, 2.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-6, 12, 5); world.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(6, 3, -6); world.add(fill);
const cam = new THREE.PerspectiveCamera(80, W / H, 0.1, 260);
world.background = new THREE.Color(WORLDS[0].sky); world.fog = new THREE.Fog(WORLDS[0].fog, 30, 150);
const GEO = { box: new THREE.BoxGeometry(1, 1, 1), ball: new THREE.IcosahedronGeometry(1, 2), ico: new THREE.IcosahedronGeometry(1, 0), cone: new THREE.ConeGeometry(1, 1, 6),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 24), disc: new THREE.CircleGeometry(1, 28).rotateX(-PI / 2), ring: new THREE.TorusGeometry(1, 0.035, 6, 48).rotateX(PI / 2), octa: new THREE.OctahedronGeometry(1, 0) };
const matCache = new Map();
function mat(color, o = {}) {
  const key = color + '|' + (o.em || 0) + '|' + (o.basic ? 1 : 0) + '|' + (o.alpha || 1) + '|' + (o.smooth ? 1 : 0);
  let m = matCache.get(key);
  if (!m) { m = o.basic ? new THREE.MeshBasicMaterial({ color }) : new THREE.MeshLambertMaterial({ color, flatShading: !o.smooth, emissive: o.em || 0 });
    if (o.alpha) { m.transparent = true; m.opacity = o.alpha; m.depthWrite = false; } matCache.set(key, m); }
  return m;
}
function part(parent, geo, m, x, y, z, sx, sy, sz) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); parent.add(o); return o; }
const OUT = 0x2a1c14;
function ledgeMesh(kind, hw, hd, cap) { // one ledge, drawn so its kind reads at a glance; its top is at y = 0
  const g = new THREE.Group(), w = hw * 2, d = hd * 2, white = mat(0xffffff, { basic: true });
  if (kind === 'n') { part(g, GEO.box, mat(0xb9814e), 0, -0.3, 0, w, 0.44, d); part(g, GEO.box, mat(cap), 0, -0.04, 0, w + 0.08, 0.1, d + 0.08); }
  else if (kind === 'm') { part(g, GEO.box, mat(0x4f9cf0), 0, -0.25, 0, w, 0.5, d); for (const s of [-1, 1]) part(g, GEO.cone, white, s * 0.42, 0.012, 0, 0.02, 0.36, 0.22).rotation.z = -s * PI / 2; } // arrows along its slide
  else if (kind === 'l') { part(g, GEO.box, mat(0x2fbfa8), 0, -0.25, 0, w, 0.5, d); part(g, GEO.cone, white, -0.3, 0.2, 0, 0.16, 0.36, 0.16); part(g, GEO.cone, white, 0.3, 0.2, 0, 0.16, 0.36, 0.16).rotation.z = PI; }  // arrows up and down
  else if (kind === 'c') { part(g, GEO.box, mat(0xe7c98a), 0, -0.22, 0, w, 0.44, d); for (let i = 1; i < w / 0.6; i++) part(g, GEO.box, mat(0x7a5a22), -hw + i * 0.6, 0.005, 0, 0.06, 0.02, d * 0.9).rotation.y = i % 2 ? 0.5 : -0.4; }
  else if (kind === 'i') { part(g, GEO.box, mat(0xc9f1ff, { em: 0x1a3a48 }), 0, -0.18, 0, w, 0.36, d); part(g, GEO.box, white, -hw * 0.35, 0.006, -hd * 0.4, w * 0.4, 0.012, 0.1);
    for (let i = 0; i < w / 0.55; i++) part(g, GEO.cone, mat(0x9fdcf5), -hw + 0.28 + i * 0.55, -0.56, 0, 0.13, 0.4, 0.13).rotation.x = PI; }
  else if (kind === 'b') { part(g, GEO.box, mat(0x7a45c2), 0, -0.4, 0, w * 0.8, 0.4, d * 0.8); part(g, GEO.cyl, mat(0x3d1f78), 0, -0.15, 0, 0.3, 0.16, 0.3); part(g, GEO.box, mat(0xff7ad1, { em: 0x4a0f3a }), 0, -0.05, 0, w, 0.12, d); }
  else if (kind === 'v') { part(g, GEO.box, mat(0x565e6c), 0, -0.22, 0, w, 0.44, d); g.userData.chev = [];
    for (let i = 0; i < Math.ceil(w / 0.7) + 1; i++) g.userData.chev.push(part(g, GEO.cone, mat(0xffd44f, { basic: true }), 0, 0.012, 0, 0.02, 0.3, 0.2)); }
  else if (kind === 'p') { part(g, GEO.box, mat(0xffd44f, { em: 0x5a4000 }), 0, -0.2, 0, w, 0.4, d); part(g, GEO.box, mat(0xfff3b0, { basic: true }), 0, 0.006, 0, w * 0.8, 0.012, 0.12); }
  return g;
}
function floorMesh(rad, summit) { // a gold rest floor right across the tower: see-through, so the climb above it shows
  const g = new THREE.Group();
  part(g, GEO.disc, mat(0xffd44f, { basic: true, alpha: 0.4 }), 0, 0, 0, rad, 1, rad);
  for (const s of [1, 0.66, 0.36]) part(g, GEO.ring, mat(0xffe58a, { basic: true }), 0, 0.01, 0, rad * s, 1, rad * s);
  if (summit) { part(g, GEO.cyl, mat(OUT), 4.5, 1.6, 0, 0.06, 3.2, 0.06); part(g, GEO.box, mat(0xe8334a, { em: 0x4a0a14 }), 5.05, 2.8, 0, 1.1, 0.7, 0.05); }
  return g;
}
function bumperMesh() { // a red spiked ball with a scowl
  const g = new THREE.Group(); part(g, GEO.ball, mat(0xff3b4e, { em: 0x4a0a14, smooth: true }), 0, 0, 0, 0.55, 0.55, 0.55);
  for (let i = 0; i < 12; i++) { const a = i / 12 * PI * 2, e = (i % 3 - 1) * 0.7, c = part(g, GEO.cone, mat(0x8a0f1e), Math.cos(a) * Math.cos(e) * 0.66, Math.sin(e) * 0.66, Math.sin(a) * Math.cos(e) * 0.66, 0.14, 0.42, 0.14);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), c.position.clone().normalize()); }
  for (const s of [-1, 1]) { part(g, GEO.ball, mat(0xffffff, { basic: true }), s * 0.2, 0.1, 0.5, 0.12, 0.14, 0.06); part(g, GEO.box, mat(OUT), s * 0.2, 0.27, 0.53, 0.26, 0.06, 0.04).rotation.z = -s * 0.5; }
  return g;
}
function climberMesh() { // a small round climber with a red scarf
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  part(body, GEO.ball, mat(0xfff3da, { smooth: true }), 0, 0.5, 0, 0.42, 0.46, 0.42);

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {

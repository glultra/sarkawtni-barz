if (params.get('gifts')) for (const d of params.get('gifts').split(',')) liveGift({ user: 'viewer' + d, gift: 'Gift ' + d, n: 1, d: Number(d) || 1 }); // a check may send gifts
if (params.get('dev') === '1') { dev.on = true; if (params.get('map')) { scene = 'play'; openMap(); dev.opened = Infinity; /* a check's own click must not place the climber */ dev.zoom = Number(params.get('map')) || mapFit(); dev.cam = params.get('map') === 'all' ? SUMMIT / 2 : dev.cam; if (params.get('map') === 'all') dev.zoom = mapFit(); } if (params.get('console') === '1') { con.open = true; runCmd('help'); } } // a check may show dev mode // a check may open a race on another of its screens
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

'use strict';
// Long Climb: one tall tower in a tall 9:16 window. Every ledge is one-way: you rise through it

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---- Input: keys by position (event.code), OS key repeat ignored; touch buttons on a phone ---

  { name: 'پشتێنی گوازەرەوە', sky: ['#5a4fb0', '#b58ad6'], cap: '#9a8cff', top: 100, rows: [[3, 4, 100, 'v', 120], [9, 3, 100, 'v', -120], [13, 3, 100], [8, 3, 100, 'v', 140], [3, 3, 100, 'v', -140], [0, 2, 100], [4, 3, 105, 'v', 150], [9, 3, 100, 'v', -150], [13, 2, 100, 'v', 150], [9, 2, 105], [5, 3, 100, 'v', -160], [8, 3, 100, 'v', 160]] },
  { name: 'تۆپە سوورەکان', sky: ['#23246a', '#5a4fb0'], cap: '#7f8cff', bumpers: true, top: 100, rows: [[6, 3, 100], [11, 2, 100], [14, 2, 100], [10, 2, 105], [6, 2, 100], [2, 3, 100], [6, 2, 105], [10, 2, 100], [14, 3, 100], [10, 2, 105], [6, 3, 100], [9, 2, 100]] },
  { name: 'لووتکە', sky: ['#0d0e2a', '#23246a'], cap: '#c9d2ff', top: 110, rows: [[4, 3, 100], [8, 2, 100, 'c'], [12, 2, 95, 'm', 4, 150], [15, 2, 100, 'i'], [11, 2, 100, 'c'], [7, 2, 95, 'b'], [3, 3, 240, 'i'], [7, 2, 100, 'v', -150], [11, 2, 100, 'c'], [13, 2, 95, 'm', 3, 160], [9, 2, 100, 'b'], [5, 3, 240], [9, 2, 100, 'c'], [12, 2, 100]] },

const plats = [], bumpers = [], rests = [], decor = [];
let SUMMIT = 0;

  floor(0, 0);

    Z.base = alt; let prev = null;
    for (const [col, wc, rise, kind = 'n', a = 0, b = 0] of Z.rows) {
      alt += rise;
      const p = { x: col * T, x0: col * T, w: wc * T, alt, kind, a, b, zone: z, dx: 0, gone: 0, shake: 0, squash: 0 };
      plats.push(p);

// ---- What is kept between sessions, and the finish code ---------------------------------------
const SAVE = 'long-climb-v1';

const B32 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

// ---- The climber ------------------------------------------------------------------------------
const PW = 30, PH = 38;
let P, cam, parts, scene, state = {};

      drawWorld();
      rr(40, 220, W - 80, 720, 30, 'rgba(12,14,22,0.9)', '#ffd44f', 5);
      text(K.summit, W / 2, 320, 60, '#ffd44f', 'center', true);
      text(K.time, W / 2 + 150, 420, 28, '#cfd6e0'); text(clockText(state.cs || 0, true), W / 2 + 150, 474, 50, '#ffffff', 'center', true);
      text(K.falls, W / 2 - 150, 420, 28, '#cfd6e0'); text(String(state.falls), W / 2 - 150, 474, 50, '#ffffff', 'center', true);
      text(K.yourCode, W / 2, 580, 28, '#cfd6e0');
      rr(W / 2 - 250, 612, 500, 90, 18, '#ffffff', '#ffd44f', 5);
      ctx.direction = 'ltr'; ctx.fillStyle = '#0c0e16'; ctx.font = `bold 50px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(state.code, W / 2, 659);
      text(K.sendCode, W / 2, 748, 25, '#ffe58a');
      if (best.cs) text(`${K.bestTime}: ${clockText(best.cs, true)}`, W / 2, 806, 26, '#ffffff');
      text(K.again, W / 2, 884, 29, '#ffd44f', 'center', true);
    },
  },
  code: { // the streamer types a viewer's code to see their time against their own
    update(dt) {
      state.t += dt;
      if (pressed('Escape')) { scene = 'title'; return; }
      while (typed.length) { const k = typed.shift(); if (k === 'Backspace') state.entry = state.entry.slice(0, -1); else if (/^[a-zA-Z0-9-]$/.test(k) && state.entry.length < 16) { state.entry += k.toUpperCase(); sfx.type(); } state.verdict = null; }
      if (pressed('Enter') && state.entry) { const c = readCode(state.entry); state.verdict = c ? { ok: true, cs: c.cs, falls: c.falls } : { ok: false }; events.push(['code', !!c]); }
    },
    draw() {
      drawWorld(); rr(40, 200, W - 80, 760, 30, 'rgba(12,14,22,0.92)');
      text(K.codeTitle, W / 2, 290, 48, '#ffffff', 'center', true); text(K.codeAsk, W / 2, 356, 26, '#cfd6e0');
      rr(W / 2 - 260, 400, 520, 96, 18, '#ffffff', '#ffd44f', 5);
      ctx.direction = 'ltr'; ctx.fillStyle = '#0c0e16'; ctx.font = `bold 50px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(state.entry + (Math.floor(state.t * 2) % 2 ? '_' : ' '), W / 2, 450);
      const v = state.verdict;
      if (v && !v.ok) text(K.codeBad, W / 2, 570, 40, '#ff6a78', 'center', true);
      if (v && v.ok) {
        text(K.codeOk, W / 2, 560, 34, '#7be08a', 'center', true);
        text(K.viewerTime, W / 2 + 150, 630, 26, '#cfd6e0'); text(clockText(v.cs, true), W / 2 + 150, 680, 44, '#ffffff', 'center', true);
        text(K.yourTime, W / 2 - 150, 630, 26, '#cfd6e0'); text(best.cs ? clockText(best.cs, true) : '-', W / 2 - 150, 680, 44, '#ffffff', 'center', true);
        text(`${K.falls}: ${v.falls}`, W / 2, 744, 26, '#cfd6e0');
        text(!best.cs ? K.noTime : v.cs < best.cs ? K.viewerWins : K.youWin, W / 2, 812, 40, '#ffd44f', 'center', true);
      }
      text(K.back, W / 2, 900, 26, '#cfd6e0');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM') && scene !== 'code') { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

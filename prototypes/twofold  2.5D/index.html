<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Is crossing between two overlaid worlds to solve a room satisfying for ten minutes? -->
<!-- Date: 2026-11-15 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twofold</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  #stage { position: relative; margin: 0 auto; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="game"></canvas></div>
<script src="vendor/three.js"></script>
<script src="config.js"></script>
<script>
'use strict';

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size of the HUD canvas; the 3D canvas sits under it
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
const TITLE = 'Twofold';
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen: a WebGL canvas for the world, a 2D canvas over it for the HUD ------------------
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: !CHEAP, stencil: true });
renderer.autoClear = false;
renderer.shadowMap.enabled = false; // figures carry their own soft blob shadows
function fit() { // fills the window at any size and pixel ratio
  const s = Math.min(innerWidth / W, innerHeight / H), r = s * (devicePixelRatio || 1);
  const cw = Math.round(W * s), ch = Math.round(H * s);
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
  stage.style.marginTop = Math.max(0, Math.floor((innerHeight - ch) / 2)) + 'px';
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  renderer.setPixelRatio(CHEAP ? 0.5 : (devicePixelRatio || 1)); renderer.setSize(cw, ch, true);
}
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { // rounded rectangle path
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
// Sounds are short note lists, played on the step clock: [delay s, Hz, length s, wave, volume]
const SFX = {
  cross: [[0, 330, 0.18, 'sine', 0.3], [0.07, 495, 0.22, 'sine', 0.25], [0.14, 660, 0.3, 'sine', 0.2]],
  bonk: [[0, 110, 0.12, 'square', 0.15]],
  pick: [[0, 520, 0.08, 'triangle', 0.25], [0.05, 700, 0.08, 'triangle', 0.2]],
  put: [[0, 300, 0.08, 'triangle', 0.25], [0.05, 200, 0.1, 'triangle', 0.25]],
  splash: [[0, 240, 0.1, 'sine', 0.25], [0.06, 160, 0.16, 'sine', 0.25], [0.14, 420, 0.12, 'triangle', 0.15]],
  press: [[0, 180, 0.07, 'square', 0.15], [0.06, 880, 0.2, 'sine', 0.2]],
  release: [[0, 440, 0.12, 'sine', 0.12]],
  lit: [[0, 523, 0.25, 'sine', 0.3], [0.1, 659, 0.25, 'sine', 0.3], [0.2, 784, 0.25, 'sine', 0.3], [0.3, 1047, 0.5, 'sine', 0.3]],
  done: [[0, 784, 0.2, 'triangle', 0.25], [0.12, 1047, 0.4, 'triangle', 0.25]],
  undo: [[0, 400, 0.08, 'sine', 0.2], [0.05, 300, 0.1, 'sine', 0.2]],
};
function sfx(name) { for (const n of SFX[name]) state.sq.push({ at: state.t + n[0], n }); }

// ---- The rooms -------------------------------------------------------------------------------
// Each room is drawn twice, once per life, on the same grid. # wall  . floor  ~ water (red life: lava)
// S start  X exit  O portal (stands in both lives)  c crate  r crate born red
// y u g switch  Y U G its door.  Rows run north to south; the camera looks from the south.
const LEVELS = [
  { name: 'A wall here, none there',
    a: ['###########', '#....#....#', '#....#....#', '#.O..#..O.#', '#....#....#', '#.S..#..X.#', '###########'],
    b: ['###########', '#.........#', '#.........#', '#.O.....O.#', '#....#....#', '#....#....#', '###########'] },
  { name: 'Something to carry',
    a: ['###########', '#.....#...#', '#.O...Y.X.#', '#.....#...#', '#.S.y.#...#', '#.....#...#', '###########'],
    b: ['###########', '#.....#...#', '#.O.c.#...#', '#.....#...#', '#.....#...#', '#.....#...#', '###########'] },
  { name: 'The long way round',
    a: ['#############', '#X..Y.......#', '####........#', '#.y.....O...#', '#~~~~~~~~~~~#', '#...........#', '#.O.........#', '#.S.........#', '#############'],
    b: ['#############', '#...#.......#', '#####.......#', '#.......O...#', '#########.###', '#...........#', '#.O..c......#', '#...........#', '#############'] },
  { name: 'A bridge of your own',
    a: ['#############', '#.....~...#X#', '#.O...~...#U#', '#.....~.....#', '#.S.c.~.....#', '#.....~.u...#', '#.....~..O..#', '#.....~.....#', '#############'],
    b: ['#############', '#...~.....#.#', '#.O.~.....#.#', '#...~.......#', '#...~...c...#', '#...~.......#', '#...~....O..#', '#...~.......#', '#############'] },
  { name: 'Both lives at once',
    a: ['#############', '#.....#...#X#', '#.y...#...#G#', '#.....#.....#', '#.S...#..c..#', '#.....#.....#', '#..O..#..O..#', '#.....#.....#', '#############'],
    b: ['#############', '#.....#...#.#', '#..c..#...#.#', '#.....#.....#', '#.....Y.g...#', '#.....#.....#', '#..O..#..O..#', '#.....#.....#', '#############'] },
];
const FIGURES = { name: 'Figures', // every figure side by side, for the outline check
  a: ['###########', '#.S.c.r...#', '#.........#', '#.........#', '#.y.Y.O.X.#', '#.........#', '###########'],
  b: ['###########', '#.........#', '#.........#', '#.........#', '#.........#', '#.........#', '###########'] };

function parseLevel(def) {
  const L = { def, w: def.a[0].length, d: def.a.length, grid: [[], []], portals: [], crates: [], switches: [], doors: [], exit: null, start: null };
  [def.a, def.b].forEach((rows, life) => rows.forEach((row, z) => {
    if (row.length !== L.w) console.error('room row width', def.name, life, z);
    L.grid[life][z] = [];
    [...row].forEach((ch, x) => {
      let cell = '.';
      if (ch === '#' || ch === '~') cell = ch;
      else if (ch === 'S') L.start = { x, z, life };
      else if (ch === 'X') L.exit = { x, z, life };
      else if (ch === 'O') { if (!L.portals.some(p => p.x === x && p.z === z)) L.portals.push({ x, z, zc: z + 0.5 }); }
      else if (ch === 'c' || ch === 'r') L.crates.push({ x, z, life, origin: ch === 'r' ? 1 : life });
      else if ('yug'.includes(ch)) L.switches.push({ x, z, life, c: ch });
      else if ('YUG'.includes(ch)) L.doors.push({ x, z, life, c: ch.toLowerCase() });
      L.grid[life][z][x] = cell;
    });
  }));
  return L;
}

// ---- Scenes ---------------------------------------------------------------------------------
let scene, state;
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = { t: 0, score: 0, gained: '', crossings: 0, undos: 0, sq: [] };
  loadLevel(Math.max(0, Math.min(LEVELS.length - 1, (Number(params.get('level')) || 1) - 1)));
}
function loadLevel(i, def) {
  const L = parseLevel(def || LEVELS[i]);
  state.li = i; state.L = L; state.score = i;
  state.p = { x: L.start.x + 0.5, z: L.start.z + 0.5, life: L.start.life, fx: 0, fz: 1, ang: 0, carry: -1, walk: 0, moving: false };
  state.crates = L.crates.map(c => ({ x: c.x, z: c.z, life: c.life, origin: c.origin, carried: false, sunk: false }));
  state.switches = L.switches.map(s => ({ x: s.x, z: s.z, life: s.life, c: s.c, on: false }));
  state.doors = L.doors.map(d => ({ x: d.x, z: d.z, life: d.life, c: d.c, o: 0 }));
  state.bridges = [];
  state.undo = []; state.first = snap(); state.flash = 0; state.doneT = 0; state.idle = 0;
  state.lit = false; state.bonkT = 0;
  state.cam = null;
  updateSwitches(true); buildView(); updateCam(true);
}
function snap() {
  const p = state.p;
  return { p: { x: p.x, z: p.z, life: p.life, fx: p.fx, fz: p.fz, ang: p.ang, carry: p.carry },
    c: state.crates.map(c => ({ x: c.x, z: c.z, life: c.life, carried: c.carried, sunk: c.sunk })), b: state.bridges.slice() };
}
function pushUndo(s) {
  state.undo.push(s || snap()); state.idle = 0;
  while (state.undo.length > tune.undo_cap) state.undo.shift();
}
function restore(s) {
  Object.assign(state.p, s.p);
  state.crates.forEach((c, i) => Object.assign(c, s.c[i]));
  state.bridges = s.b.slice(); state.flash = 0; state.idle = 0;
  updateSwitches(true);
}

// What stops the walker in one life: its walls, its water, its closed doors, its crates.
const R = 0.28; // the walker's half width, in tiles
function bridged(life, x, z) { return state.bridges.includes(life + ':' + x + ',' + z); }
function solidCell(life, x, z, doorAt = 0.9) {
  const L = state.L;
  if (x < 0 || z < 0 || x >= L.w || z >= L.d) return true;
  const ch = L.grid[life][z][x];
  if (ch === '#' || (ch === '~' && !bridged(life, x, z))) return true;
  for (const d of state.doors) if (d.life === life && d.x === x && d.z === z && d.o < doorAt) return true;
  for (const c of state.crates) if (c.life === life && !c.carried && !c.sunk && c.x === x && c.z === z) return true;
  return false;
}
function blocked(life, x, z) {
  return solidCell(life, Math.floor(x - R), Math.floor(z - R)) || solidCell(life, Math.floor(x + R), Math.floor(z - R)) ||
    solidCell(life, Math.floor(x - R), Math.floor(z + R)) || solidCell(life, Math.floor(x + R), Math.floor(z + R));
}

function updateSwitches(instant) {
  const p = state.p, px = Math.floor(p.x), pz = Math.floor(p.z);
  for (const s of state.switches) {
    let on = p.life === s.life && px === s.x && pz === s.z;
    for (const c of state.crates) if (c.life === s.life && !c.carried && !c.sunk && c.x === s.x && c.z === s.z) on = true;
    if (on !== s.on && !instant) sfx(on ? 'press' : 'release');
    s.on = on;
  }
  for (const d of state.doors) {
    let want = state.switches.some(s => s.c === d.c && s.on) ? 1 : 0;
    if (!want && d.o > 0 && p.life === d.life && // never closes on the walker
      p.x + R > d.x && p.x - R < d.x + 1 && p.z + R > d.z && p.z - R < d.z + 1) want = d.o;
    if (instant) d.o = want;
    else if (d.o < want) d.o = Math.min(want, d.o + tune.door_open_speed * STEP);
    else if (d.o > want) d.o = Math.max(want, d.o - tune.door_close_speed * STEP);
  }
}

// The exit lights when the walker could walk to it in this life.
function exitReachable() {
  const p = state.p, e = state.L.exit, L = state.L;
  if (p.life !== e.life) return false;
  const sx = Math.floor(p.x), sz = Math.floor(p.z), seen = new Set([sx + sz * L.w]), q = [[sx, sz]];
  while (q.length) {
    const [x, z] = q.pop();
    if (x === e.x && z === e.z) return true;
    for (const [ax, az] of [[x + 1, z], [x - 1, z], [x, z + 1], [x, z - 1]])
      if (!seen.has(ax + az * L.w) && !solidCell(e.life, ax, az, 0.5)) { seen.add(ax + az * L.w); q.push([ax, az]); }
  }
  return false;
}

function reachable() { // the crate the walker could pick up now, or -1: the one faced first, then one beside
  const p = state.p, px = Math.floor(p.x), pz = Math.floor(p.z);
  if (p.carry >= 0) return -1;
  for (const [dx, dz] of [[p.fx, p.fz], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const i = state.crates.findIndex(c => c.life === p.life && !c.carried && !c.sunk && c.x === px + dx && c.z === pz + dz);
    if (i >= 0) return i;
  }
  return -1;
}
function tryCarry() {
  const p = state.p, L = state.L, px = Math.floor(p.x), pz = Math.floor(p.z);
  if (p.carry < 0) {
    const i = reachable();
    if (i >= 0) { pushUndo(); state.crates[i].carried = true; p.carry = i; sfx('pick'); }
    return;
  }
  const c = state.crates[p.carry], tx = px + p.fx, tz = pz + p.fz; // put down in the tile ahead
  let ok = tx >= 0 && tz >= 0 && tx < L.w && tz < L.d && L.grid[p.life][tz][tx] !== '#';
  if (ok && state.crates.some(o => o !== c && o.life === p.life && !o.sunk && !o.carried && o.x === tx && o.z === tz)) ok = false;
  if (ok && state.doors.some(d => d.life === p.life && d.x === tx && d.z === tz)) ok = false;   // never in a doorway
  if (ok && L.portals.some(o => o.x === tx && o.z === tz)) ok = false;                          // never under an arch
  if (ok && L.exit.life === p.life && L.exit.x === tx && L.exit.z === tz) ok = false;
  let nx = p.x, nz = p.z; // step back so the crate has room
  if (p.fx > 0) nx = Math.min(nx, tx - R - 0.001); if (p.fx < 0) nx = Math.max(nx, tx + 1 + R + 0.001);
  if (p.fz > 0) nz = Math.min(nz, tz - R - 0.001); if (p.fz < 0) nz = Math.max(nz, tz + 1 + R + 0.001);
  if (ok && blocked(p.life, nx, nz)) ok = false;
  if (!ok) { sfx('bonk'); return; }
  pushUndo(); p.x = nx; p.z = nz;
  c.carried = false; c.x = tx; c.z = tz; c.life = p.life; p.carry = -1;
  if (L.grid[p.life][tz][tx] === '~' && !bridged(p.life, tx, tz)) { // into the water: it becomes a bridge
    c.sunk = true; state.bridges.push(p.life + ':' + tx + ',' + tz); sfx('splash'); events.push({ type: 'bridge', t: state.t });
  } else sfx('put');
}

function updateCam(snapTo) {
  const p = state.p, L = state.L, k = tune.cam_follow;
  const tx = L.w / 2 + (p.x - L.w / 2) * k, tz = L.d / 2 + (p.z - L.d / 2) * k;
  if (snapTo || !state.cam) state.cam = { x: tx, z: tz };
  else { state.cam.x += (tx - state.cam.x) * 0.08; state.cam.z += (tz - state.cam.z) * 0.08; }
}

function updatePlay(dt) {
  const p = state.p, L = state.L;
  state.t += dt;
  for (let i = state.sq.length - 1; i >= 0; i--)
    if (state.sq[i].at <= state.t) { const n = state.sq[i].n; tone(n[1], n[2], n[3], n[4]); state.sq.splice(i, 1); }
  state.flash = Math.max(0, state.flash - dt);
  state.bonkT = Math.max(0, state.bonkT - dt);
  if (state.doneT > 0) { // on the lit exit: a beat, then the next room
    state.doneT -= dt;
    if (state.doneT <= 0) {
      if (state.li + 1 < LEVELS.length) loadLevel(state.li + 1);
      else { state.score = LEVELS.length; state.gained = 'You walked both lives'; scene = 'results'; }
    }
    return;
  }
  state.idle += dt;

  if (pressed('KeyZ') && state.undo.length) { restore(state.undo.pop()); state.undos++; sfx('undo'); return; }
  if (pressed('KeyR')) { pushUndo(); restore(state.first); sfx('undo'); return; }
  if (pressed('KeyE') || pressed('Space')) tryCarry();

  // Walk: up the screen is north
  let ix = (down.has('ArrowRight') || down.has('KeyD') ? 1 : 0) - (down.has('ArrowLeft') || down.has('KeyA') ? 1 : 0);
  let iz = (down.has('ArrowDown') || down.has('KeyS') ? 1 : 0) - (down.has('ArrowUp') || down.has('KeyW') ? 1 : 0);
  p.moving = ix !== 0 || iz !== 0;
  if (p.moving) {
    if (ix && iz) { if (p.fx && !p.fz) { p.fx = ix; } else { p.fx = 0; p.fz = iz; } } // on a diagonal, keep the axis faced
    else { p.fx = ix; p.fz = iz; }
    const n = Math.hypot(ix, iz), dx = ix / n * tune.move_speed * dt, dz = iz / n * tune.move_speed * dt;
    const want = Math.atan2(ix, iz); let da = want - p.ang;
    while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    p.ang += da * Math.min(1, tune.turn_speed * dt); p.walk += dt * 13;
    if (dx && !blocked(p.life, p.x + dx, p.z)) p.x += dx;
    if (dz && !blocked(p.life, p.x, p.z + dz)) {
      const oz = p.z; let nz = p.z + dz;
      // Through an arch: the walker's middle passes the portal's line, and the life swaps
      const pt = L.portals.find(o => Math.floor(p.x) === o.x && ((oz < o.zc && nz >= o.zc) || (oz > o.zc && nz <= o.zc)));
      if (!pt) p.z = nz;
      else {
        nz = pt.zc + Math.sign(dz) * Math.max(Math.abs(nz - pt.zc), 0.02);
        const other = 1 - p.life;
        if (blocked(other, p.x, nz)) { if (!state.bonkT) { sfx('bonk'); state.bonkT = 0.4; } } // the other life is solid here
        else {
          pushUndo(); p.z = nz; p.life = other; if (p.carry >= 0) state.crates[p.carry].life = other;
          state.flash = tune.flash_s; state.crossings++; sfx('cross'); events.push({ type: 'cross', life: other, t: state.t });
        }
      }
    }
  }

  updateSwitches(false);
  const lit = exitReachable();
  if (lit && !state.lit) { sfx('lit'); events.push({ type: 'lit', t: state.t }); }
  state.lit = lit;
  if (p.life === L.exit.life && Math.floor(p.x) === L.exit.x && Math.floor(p.z) === L.exit.z) {
    state.doneT = tune.level_done_s; state.lit = true; sfx('done'); events.push({ type: 'solved', level: state.li + 1, t: state.t });
  }
  updateCam(false);
}

// ---- The 3D view: one scene per life, the other one seen through each portal ---------------
const LOOK = [ // the colourful life, the red life
  { name: 'Colourful life', bg: 0xbfe9ff, floor: [0x9be07a, 0x8ed56d], out: 0x84cc66, wall: 0xf6e2c3, cap: 0xffb3c7, water: 0x62c9f2, waterGlow: 0x0a3a55,
    hemi: [0xffffff, 0x9ad68a, 2.3], sun: [0xfff4e0, 2.1], hud: '#35e0cf', ground: '#58c04a' },
  { name: 'Red life', bg: 0x1d070c, floor: [0xb02a3c, 0x8a1c2b], out: 0x3a0b14, wall: 0x5a1626, cap: 0xff5c72, water: 0xff6a2a, waterGlow: 0xb02a00,
    hemi: [0xffd0d0, 0x2a050b, 1.15], sun: [0xffb0a0, 1.5], hud: '#ff3b4a', ground: '#b3202a' },
];
const KEYCOL = { y: 0xffd23f, u: 0x4f8cff, g: 0x5fd068 };
const GEO = {
  box: new THREE.BoxGeometry(1, 1, 1), sph: new THREE.SphereGeometry(0.5, 18, 14), ico: new THREE.IcosahedronGeometry(0.5, 1),

function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes2d[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

addEventListener('resize', fit); fit();
reset();
scene = params.get('scene') || 'title';
if (scene === 'figures') loadLevel(0, FIGURES);
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

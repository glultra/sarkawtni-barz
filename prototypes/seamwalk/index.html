<!doctype html>

<!-- Question: Is walking through impossible spaces between two lives fun for ten minutes in first person? -->
<!-- Date: 2026-11-15 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seamwalk</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  #stage { position: relative; margin: 0 auto; }
  #stage canvas { display: block; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="game"></canvas></div>
<script src="vendor/three.js"></script>
<script src="config.js"></script>
<script>
'use strict';
// Seamwalk: a first-person walk through a garden that exists twice. Every arch, door and
// seam is a portal face: a flat opening linked to another one somewhere else. The world is
// drawn through each face from where you stand, and walking through one moves you with no cut.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size of the HUD
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
const TITLE = 'Seamwalk';
const CONTROLS = [
  'W A S D: walk     Mouse: look around (click the game first)',
  'E: pick up a cube, or put it down',
  'R: restart the space     P: pause     M: mute     Esc: free the mouse',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function scatterRng(s) { // the scenery's own generator: the same seed plants the same trees in every copy of a place
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), s | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const events = []; // window.game.events: anything the game wants a run to see
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI;

// ---- Screen: a WebGL canvas for the world, a 2D canvas over it for the HUD ----------------
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: !CHEAP });
renderer.shadowMap.enabled = false;
const RES = new THREE.Vector2(1, 1); // the drawing buffer's size; every portal face reads it
const pool = [];                     // render targets, by depth then by face seen
function freeTargets() { pool.forEach(row => row.forEach(rt => rt.dispose())); pool.length = 0; }
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.round(W * k), ch = Math.round(H * k), r = k * (devicePixelRatio || 1);
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
  stage.style.marginTop = Math.max(0, Math.floor((innerHeight - ch) / 2)) + 'px';
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  renderer.setPixelRatio(CHEAP ? 0.5 : Math.min(devicePixelRatio || 1, 2)); renderer.setSize(cw, ch, true);
  renderer.getDrawingBufferSize(RES); freeTargets();
}
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function panel(x, y, w, h, r, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
// The mouse: captured on a click, read raw where the browser allows, never accelerated twice.
let locked = false;
function lockMouse() {
  if (CHEAP || !stage.requestPointerLock) return;
  try {
    const p = stage.requestPointerLock({ unadjustedMovement: true });
    if (p && p.catch) p.catch(() => { try { const q = stage.requestPointerLock(); if (q && q.catch) q.catch(() => {}); } catch (e) {} });
  } catch (e) {}
}
function freeMouse() { if (document.exitPointerLock && document.pointerLockElement) document.exitPointerLock(); }
addEventListener('pointerdown', () => {
  startAudio();
  if (scene === 'title') hit.add('Enter');
  else if (scene === 'pause') hit.add('KeyP');
  if (scene === 'title' || scene === 'pause' || scene === 'play') lockMouse();
});
document.addEventListener('pointerlockchange', () => {
  const now = document.pointerLockElement === stage;
  if (locked && !now && scene === 'play') scene = 'pause'; // Esc freed the mouse
  locked = now;
});
document.addEventListener('mousemove', e => {
  if (!locked || scene !== 'play' || !P) return;
  const mx = e.movementX || 0, my = e.movementY || 0;
  if (Math.abs(mx) > 400 || Math.abs(my) > 400) return; // a browser's stray jump, not the hand
  P.yawT -= mx * tune.look_sens;
  P.pitchT = clamp(P.pitchT - my * tune.look_sens, -1.45, 1.45);
});

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'sine', vol = 0.2, to = 0, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  step: n => tone(n % 2 ? 150 : 170, 0.06, 'triangle', 0.05),
  toRed: () => { tone(520, 0.45, 'sine', 0.16, 180); tone(780, 0.4, 'triangle', 0.07, 260); },
  toColour: () => { tone(260, 0.45, 'sine', 0.16, 660); tone(390, 0.4, 'triangle', 0.07, 990); },
  pick: () => tone(440, 0.12, 'triangle', 0.16, 660),
  put: () => tone(330, 0.12, 'triangle', 0.16, 220),
  no: () => tone(140, 0.14, 'square', 0.06),
  splash: () => { tone(700, 0.25, 'sine', 0.12, 200); tone(300, 0.3, 'triangle', 0.08, 120, 0.05); },
  sw: () => tone(600, 0.08, 'square', 0.07, 900),
  door: () => tone(110, 0.5, 'sawtooth', 0.06, 70),
  land: () => tone(90, 0.12, 'triangle', 0.18, 50),
  solved: () => [660, 880, 1320].forEach((f, i) => tone(f, 0.5, 'sine', 0.14, 0, i * 0.09)),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.14, 0, i * 0.1)),
};

// ---- The look: one palette per kind of place ---------------------------------------------
const THEMES = {
  green: { life: 'colour', open: true, sky: 0xbfe8ff, ground: 0x86d06e, hill: 0x74c463, tileA: 0xb4ec9c, tileB: 0xa2e088,
    wall: 0xf6e9c8, top: 0xf8b6c9, hedge: 0x4aa85a, hedgeTop: 0x63bf6b, stone: 0xd9d2c4, wood: 0xc8915a, shed: 0xf4dcae,
    roof: 0xf07f95, water: 0x6fd2f7, trunk: 0x9b6b45, leafs: [0x5cc46a, 0xf8a9c4, 0x7fd67f, 0xfad0dc], flowers: [0xffd23f, 0xffffff, 0xff8fb8] },
  red: { life: 'red', open: true, sky: 0x6a1226, ground: 0x8c1a2a, hill: 0x6e1222, tileA: 0xb5263a, tileB: 0x9e1e30,
    wall: 0x4c1c26, top: 0x8a2638, hedge: 0x6a1a2e, hedgeTop: 0x8a2238, stone: 0x4c242a, wood: 0x4a1c20, shed: 0x45181e,
    roof: 0x260a10, water: 0xff7a3a, trunk: 0x2a1014, leafs: [0xff5a7a, 0xff9ab0, 0xd42a50, 0xffc0cc], flowers: [0xff9ab0, 0xffd0d8, 0xff5a7a] },
  hall: { life: 'colour', open: false, sky: 0xf6e9c8, tileA: 0xf2d9a6, tileB: 0xe6c98e, wall: 0xf6e9c8, top: 0xf8b6c9,
    ceil: 0xfbf5e6, stone: 0xd9d2c4, wood: 0xc8915a, leafs: [0x5cc46a], flowers: [0xffd23f] },
  cave: { life: 'red', open: false, sky: 0x2a0c14, tileA: 0xa02438, tileB: 0x861c30, wall: 0x6e2436, top: 0xa23048,
    ceil: 0x3c1422, plank: 0x5a2a2a, stone: 0x4c242a, wood: 0x4a1c20, leafs: [0xff5a7a, 0xff9ab0, 0xd42a50], flowers: [0xff9ab0] },
};
const KEYS = { y: { color: 0xffd23f, name: 'yellow' }, p: { color: 0xff6ec0, name: 'pink' } };
const CUBE = 0xff9a3c, CUBE_LIGHT = 0xffc27a, FRAME = 0xf9eaa2, RIM = 0xfffbd8, DOORWOOD = 0xb9824c;
const GEO = {
  box: new THREE.BoxGeometry(1, 1, 1),
  ico: new THREE.IcosahedronGeometry(1, 0),
  ball: new THREE.IcosahedronGeometry(1, 1),
  cone: new THREE.ConeGeometry(1, 1, 5),
  pyr: new THREE.ConeGeometry(1, 1, 4),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 8),
  tri: new THREE.CylinderGeometry(1, 1, 1, 3),
  octa: new THREE.OctahedronGeometry(1, 0),
  plane: new THREE.PlaneGeometry(1, 1).rotateX(-PI / 2),
};
const matCache = new Map();
function mat(color, o = {}) { // shared flat-shaded materials, one per colour
  const key = color + '|' + (o.em || 0) + '|' + (o.basic ? 1 : 0) + '|' + (o.alpha || 1);
  let m = matCache.get(key);
  if (!m) {
    m = o.basic ? new THREE.MeshBasicMaterial({ color })
      : new THREE.MeshLambertMaterial({ color, flatShading: true, emissive: o.em || 0 });
    if (o.alpha) { m.transparent = true; m.opacity = o.alpha; m.depthWrite = false; }
    matCache.set(key, m);
  }
  return m;
}
for (const th of Object.values(THEMES)) { // a 2 m checker for each theme's floor
  const c = document.createElement('canvas'); c.width = c.height = 2;
  const g = c.getContext('2d'), hex = v => '#' + v.toString(16).padStart(6, '0');
  g.fillStyle = hex(th.tileA); g.fillRect(0, 0, 2, 2); g.fillStyle = hex(th.tileB); g.fillRect(0, 0, 1, 1); g.fillRect(1, 1, 1, 1);
  th.tex = new THREE.CanvasTexture(c); th.tex.colorSpace = THREE.SRGBColorSpace;
  th.tex.magFilter = THREE.NearestFilter; th.tex.wrapS = th.tex.wrapT = THREE.RepeatWrapping; th.tex.anisotropy = 4;
  th.skyC = new THREE.Color(th.sky); th.fog = new THREE.Fog(th.sky, 45, 150);
}

const world = new THREE.Scene();
world.add(new THREE.HemisphereLight(0xffffff, 0x9a8f98, 2.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-5, 10, 6); world.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(7, 4, -5); world.add(fill); // so no wall is flat
const cam = new THREE.PerspectiveCamera(74, W / H, 0.03, 170); world.add(cam);
const vcams = [0, 1, 2, 3].map(() => new THREE.PerspectiveCamera());
addEventListener('resize', fit); fit();

// ---- Portal faces --------------------------------------------------------------------------
// A face is a flat opening seen and entered from its front. It shows what its linked face
// looks out on, and walking through it carries you out of the linked face's front.
const DUMMY = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); DUMMY.needsUpdate = true;
const FACE_VS = `
#include <common>
#include <clipping_planes_pars_vertex>
void main() {
  #include <begin_vertex>
  #include <project_vertex>
  #include <clipping_planes_vertex>
}`;
const FACE_FS = `
uniform sampler2D map; uniform vec2 res; uniform vec3 flatColor; uniform float flatMix;
#include <common>
#include <clipping_planes_pars_fragment>
void main() {
  #include <clipping_planes_fragment>
  vec4 c = texture2D(map, gl_FragCoord.xy / res);
  gl_FragColor = vec4(mix(c.rgb, flatColor, flatMix), 1.0);
  #include <colorspace_fragment>
}`;
function rotL(yaw, lx, lz) { return [lx * Math.cos(yaw) + lz * Math.sin(yaw), -lx * Math.sin(yaw) + lz * Math.cos(yaw)]; }
function archOutline(hw, hs) { // a doorway with a round top
  const s = new THREE.Shape(); s.moveTo(-hw, 0); s.lineTo(hw, 0); s.lineTo(hw, hs);
  s.absarc(0, hs, hw, 0, PI, false); s.lineTo(-hw, 0); return s;
}
function rectOutline(hw, h) {
  const s = new THREE.Shape(); s.moveTo(-hw, 0); s.lineTo(hw, 0); s.lineTo(hw, h); s.lineTo(-hw, h); s.lineTo(-hw, 0); return s;
}
function frameOutline(kind, hi, ho, h) { // the frame round an opening, as one outline
  const s = new THREE.Shape(); s.moveTo(-ho, 0); s.lineTo(-hi, 0);
  if (kind === 'arch') {
    const hs = h - hi; s.lineTo(-hi, hs); s.absarc(0, hs, hi, PI, 0, true); s.lineTo(hi, 0); s.lineTo(ho, 0);
    s.lineTo(ho, hs); s.absarc(0, hs, ho, 0, PI, false);
  } else {
    s.lineTo(-hi, h); s.lineTo(hi, h); s.lineTo(hi, 0); s.lineTo(ho, 0); s.lineTo(ho, h + (ho - hi)); s.lineTo(-ho, h + (ho - hi));
  }
  s.lineTo(-ho, 0); return s;
}

// ---- Building a level -------------------------------------------------------------------
let L = null; // the level being played: its zones, colliders, floors, faces and things
function builder(L) {
  const B = {};
  B.zone = themeName => {
    const th = THEMES[themeName], idx = L.zones.length, ox = idx * 500;
    const g = new THREE.Group(); g.position.x = ox; L.group.add(g);
    const Z = { idx, ox, th, g };
    L.zones.push(Z);
    const own = o => { L.disp.push(o); return o; };
    Z.box = (x0, y0, z0, x1, y1, z1, color, o) => {
      const m = new THREE.Mesh(GEO.box, mat(color, o));
      m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.scale.set(x1 - x0, y1 - y0, z1 - z0); g.add(m); return m;
    };
    Z.blob = (geo, x, y, z, sx, sy, sz, color, o, ry = 0) => {
      const m = new THREE.Mesh(geo, mat(color, o)); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.y = ry; g.add(m); return m;
    };
    Z.solid = (x0, z0, x1, z1, y0, y1, extra) => {
      const c = Object.assign({ x0: x0 + ox, z0, x1: x1 + ox, z1, y0, y1 }, extra); L.colliders.push(c); return c;
    };
    Z.region = (x0, z0, x1, z1, ya, yb, axis) => {
      L.regions.push({ x0: x0 + ox, z0, x1: x1 + ox, z1, ya, yb: yb === undefined ? ya : yb, axis: axis || 'x' });
    };
    Z.tiles = (x0, z0, x1, z1, y = 0, from = th) => {
      const t = own(from.tex.clone()); t.needsUpdate = true;
      t.repeat.set((x1 - x0) / 2, (z1 - z0) / 2); t.offset.set(x0 / 2, -z1 / 2);
      const m = new THREE.Mesh(GEO.plane, own(new THREE.MeshLambertMaterial({ map: t })));
      m.position.set((x0 + x1) / 2, y + 0.012, (z0 + z1) / 2); m.scale.set(x1 - x0, 1, z1 - z0); g.add(m);
    };
    Z.ground = () => {
      const m = new THREE.Mesh(GEO.plane, mat(th.ground)); m.position.y = -0.02; m.scale.set(420, 1, 420); g.add(m);
    };
    Z.wall = (x0, z0, x1, z1, h = 3.4, y = 0) => {
      Z.box(x0, y, z0, x1, y + h - 0.28, z1, th.wall); Z.box(x0 - 0.07, y + h - 0.28, z0 - 0.07, x1 + 0.07, y + h, z1 + 0.07, th.top);
      Z.solid(x0, z0, x1, z1, y, y + h);
    };
    Z.hedge = (x0, z0, x1, z1, h = 2.8) => {
      Z.box(x0, 0, z0, x1, h - 0.25, z1, th.hedge); Z.box(x0 + 0.04, h - 0.25, z0 + 0.04, x1 - 0.04, h, z1 - 0.04, th.hedgeTop);
      Z.solid(x0, z0, x1, z1, 0, h);
      const lx = x1 - x0, lz = z1 - z0, len = Math.max(lx, lz), n = Math.floor(len / 1.5);
      for (let i = 0; i < n; i++) { // a row of clipped tufts along the top
        const t = (i + 0.5) / n, bx = lx > lz ? x0 + lx * t : (x0 + x1) / 2, bz = lx > lz ? (z0 + z1) / 2 : z0 + lz * t;
        Z.blob(GEO.ico, bx, h + 0.05, bz, 0.42, 0.32, 0.42, th.hedgeTop, undefined, i * 1.3);
      }
    };
    Z.deck = (x0, z0, x1, z1, y) => { // a floor in the air: walk on it or under it
      Z.box(x0, y - 0.3, z0, x1, y, z1, th.wood); Z.tiles(x0, z0, x1, z1, y, th.life === 'red' ? THEMES.cave : THEMES.hall); Z.region(x0, z0, x1, z1, y);
    };
    Z.rail = (x0, z0, x1, z1, y) => { Z.box(x0, y, z0, x1, y + 0.55, z1, th.top); Z.solid(x0, z0, x1, z1, y, y + 1.2); };
    Z.post = (x, z, y1) => { Z.box(x - 0.17, 0, z - 0.17, x + 0.17, y1, z + 0.17, th.wood); Z.solid(x - 0.17, z - 0.17, x + 0.17, z + 0.17, 0, y1); };
    Z.ramp = (x0, z0, x1, z1, ya, yb, axis) => { // stairs to look at, a smooth slope to walk on
      Z.region(x0, z0, x1, z1, ya, yb, axis);
      const n = 10;
      for (let i = 0; i < n; i++) {
        const a = i / n, b = (i + 1) / n, low = lerp(ya, yb, a), high = lerp(ya, yb, b);
        const sx0 = axis === 'x' ? lerp(x0, x1, a) : x0, sx1 = axis === 'x' ? lerp(x0, x1, b) : x1;
        const sz0 = axis === 'z' ? lerp(z0, z1, a) : z0, sz1 = axis === 'z' ? lerp(z0, z1, b) : z1;
        const top = Math.max(low, high), bottom = Math.min(low, high);
        Z.box(sx0, 0, sz0, sx1, top, sz1, i % 2 ? th.stone : th.top);
        if (bottom > 0.5) Z.solid(sx0, sz0, sx1, sz1, 0, bottom - 0.25); // lower than the walker climbing it, so only the ground bumps it
      }
    };
    Z.water = (x0, z0, x1, z1) => {
      Z.box(x0, 0.0, z0, x1, 0.05, z1, th.water, { basic: true });
      Z.box(x0 - 0.12, 0, z0 - 0.12, x1 + 0.12, 0.03, z1 + 0.12, th.stone);
      Z.solid(x0, z0, x1, z1, -1, 0.6); L.waters.push({ Z, x0: x0 + ox, z0, x1: x1 + ox, z1 });
    };
    // Scenery: a tree, bush and flower in the colourful life are a crystal, mushroom and shard in the red
    Z.tree = (x, z, s = 1, i = 0) => {
      const c = th.leafs[i % th.leafs.length];
      if (th.life === 'red') {
        if (i % 2) { // a tall mushroom
          Z.blob(GEO.cyl, x, 0.9 * s, z, 0.22 * s, 1.8 * s, 0.22 * s, 0xf2d2c8);
          Z.blob(GEO.ball, x, 1.8 * s, z, 1.1 * s, 0.55 * s, 1.1 * s, c, { em: 0x3a0812 });
        } else { // a cluster of crystals
          Z.blob(GEO.cone, x, 1.5 * s, z, 0.5 * s, 3 * s, 0.5 * s, c, { em: 0x70182c }, i);
          Z.blob(GEO.cone, x + 0.5 * s, 0.9 * s, z + 0.2 * s, 0.35 * s, 1.8 * s, 0.35 * s, c, { em: 0x70182c }, i + 1).rotation.z = -0.35;
          Z.blob(GEO.cone, x - 0.45 * s, 0.7 * s, z - 0.2 * s, 0.3 * s, 1.4 * s, 0.3 * s, c, { em: 0x70182c }, i + 2).rotation.z = 0.4;
        }
      } else {
        Z.blob(GEO.cyl, x, 0.8 * s, z, 0.16 * s, 1.6 * s, 0.16 * s, th.trunk);
        Z.blob(GEO.ico, x, 2.3 * s, z, 1.1 * s, 1.0 * s, 1.1 * s, c, undefined, i);
        Z.blob(GEO.ico, x + 0.5 * s, 3.0 * s, z - 0.2 * s, 0.7 * s, 0.65 * s, 0.7 * s, c, undefined, i + 2);
      }
    };

  state.prompt = P.hold ? 'E: put the cube down' : c ? 'E: pick up the cube' : '';
  if (state.won || !(pressed('KeyE') || pressed('Space'))) return;
  if (P.hold) putDown();
  else if (c) {
    c.held = true; P.hold = c; L.group.remove(c.mesh); cam.add(c.mesh);
    c.mesh.position.set(0.42, -0.46, -1.05); c.mesh.rotation.set(0.15, 0.5, 0); sfx.pick(); events.push(['cube', 'up']);
  }
}
function stepWorld(dt) {
  const held = new Set();
  for (const s of L.switches) {
    const on = (P.Z === s.Z && Math.abs(P.y - s.y) < 0.5 && Math.hypot(P.x - s.x, P.z - s.z) < 0.75)
      || L.cubes.some(c => !c.held && c.Z === s.Z && Math.abs(c.y - s.y) < 0.5 && Math.hypot(c.x - s.x, c.z - s.z) < 0.8);
    if (on !== s.down) { s.down = on; if (dt) sfx.sw(); events.push(['switch', s.key, on]); }
    if (on) held.add(s.key);
    s.plate.position.y = s.base + (on ? 0.07 : 0.11); s.mk.position.y = s.base + (on ? 0.13 : 0.17);
  }
  for (const d of L.doors) {
    const want = held.has(d.key) ? 1 : 0;
    if (want !== d.open && !d.moving) { d.moving = true; if (dt) sfx.door(); }
    d.open = want > d.open ? Math.min(1, d.open + tune.door_speed * dt) : Math.max(0, d.open - tune.door_speed * dt);
    if (d.open === want) d.moving = false;
    d.col.off = d.open > 0.85; d.grp.scale.y = Math.max(0.02, 1 - d.open); d.grp.visible = d.open < 0.99;
  }
  for (const c of L.cubes) {
    if (c.held) { c.mesh.rotation.y = 0.5 + Math.sin(state.t * 2) * 0.05; continue; }
    c.drop = Math.max(0, c.drop - dt * Math.max(2, c.drop * 6));
    c.mesh.position.set(c.x, c.y + 0.35 + c.drop, c.z);
  }
  const g = L.gate;
  if (g) {
    const near = P.Z === g.Z && Math.abs(P.y - g.y) < 0.6 ? Math.hypot(P.x - g.x, P.z - g.z) : Infinity;
    if (!g.lit) {
      const open = L.gateKey ? L.doors.filter(d => d.key === L.gateKey).every(d => d.open > 0.85) : near < tune.gate_light_dist;
      if (open) { g.lit = true; state.solved = true; if (dt) sfx.solved(); events.push(['solved', state.level]); }
    }
    g.starMat.color.setHex(g.lit ? 0xffe066 : 0x9aa0a8); g.starMat.emissive.setHex(g.lit ? 0xb08a00 : 0);
    g.sheet.visible = g.lit; g.bars.forEach(b => { b.visible = !g.lit; });
    g.star.rotation.y = state.t * (g.lit ? 2 : 0.4);
    if (g.lit && !state.won && near < 1.0 && dt) { state.won = true; state.fadeDir = 1; sfx.win(); events.push(['won', state.level]); }
  }
}

// ---- Drawing the world through its faces ------------------------------------------------------
const frustum = new THREE.Frustum(), _pm = new THREE.Matrix4(), _v4 = new THREE.Vector4(), NOCLIP = [];
const _cp = [0, 1, 2, 3, 4].map(() => new THREE.Vector3());
const FULL = [-1, -1, 1, 1];
function screenRect(f, pm) { // where a face lands on the screen, as a box
  let x0 = 1, y0 = 1, x1 = -1, y1 = -1;
  for (const c of f.corners) {
    _v4.set(c.x, c.y, c.z, 1).applyMatrix4(pm);
    if (_v4.w <= 0.02) return FULL;
    const x = _v4.x / _v4.w, y = _v4.y / _v4.w;
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  }
  return [Math.max(-1, x0), Math.max(-1, y0), Math.min(1, x1), Math.min(1, y1)];
}
function target(depth, i) {
  const row = pool[depth] || (pool[depth] = []);
  return row[i] || (row[i] = new THREE.WebGLRenderTarget(RES.x, RES.y, { type: THREE.HalfFloatType, samples: !CHEAP && depth === 0 ? 4 : 0 }));
}
function renderView(c, depth, into, skip, clip, theme, rect) {
  const cp = _cp[depth].setFromMatrixPosition(c.matrixWorld), seen = [];
  if (depth < tune.portal_depth) {
    _pm.multiplyMatrices(c.projectionMatrix, c.matrixWorldInverse); frustum.setFromProjectionMatrix(_pm);
    for (const f of L.faces) {
      if (skip && (f === skip || f === skip.twin)) continue;
      const d = (cp.x - f.x) * f.nx + (cp.z - f.z) * f.nz;
      if (d <= 0.0005 || d > 70 || Math.abs(cp.x - f.x) > 200) continue;
      if (clip && clip.distanceToPoint(f.sphere.center) < -f.sphere.radius) continue;
      if (!frustum.intersectsSphere(f.sphere)) continue;
      const r = screenRect(f, _pm), x0 = Math.max(r[0], rect[0]), y0 = Math.max(r[1], rect[1]), x1 = Math.min(r[2], rect[2]), y1 = Math.min(r[3], rect[3]);
      if (x1 <= x0 || y1 <= y0) continue;
      seen.push({ f, rect: [x0, y0, x1, y1], rt: null });
    }
  }
  seen.forEach((e, i) => { // first what each face looks out on, from where this view would stand beyond it
    const vc = vcams[depth], f = e.f;
    vc.projectionMatrix.copy(c.projectionMatrix); vc.projectionMatrixInverse.copy(c.projectionMatrixInverse);
    vc.matrix.multiplyMatrices(f.M, c.matrixWorld); vc.matrix.decompose(vc.position, vc.quaternion, vc.scale); vc.updateMatrixWorld(true);
    e.rt = target(depth, i);
    renderView(vc, depth + 1, e.rt, f.target, f.target.plane, f.target.Z.th, e.rect);
  });
  cp.setFromMatrixPosition(c.matrixWorld);
  for (const f of L.faces) {
    const d = (cp.x - f.x) * f.nx + (cp.z - f.z) * f.nz;
    f.mesh.visible = d > 0.0005 && !(skip && (f === skip || f === skip.twin));
    f.mat.uniforms.map.value = DUMMY; f.mat.uniforms.flatMix.value = 1; f.mat.uniforms.flatColor.value.copy(f.target.Z.th.skyC);
  }
  for (const e of seen) { e.f.mat.uniforms.map.value = e.rt.texture; e.f.mat.uniforms.flatMix.value = 0; }
  world.background = theme.skyC; world.fog = theme.fog;
  renderer.clippingPlanes = clip ? [clip] : NOCLIP;
  renderer.setRenderTarget(into); renderer.render(world, c);
}
function draw3D(x, y, z, yaw, pitch, Zv) {
  if (cam.fov !== tune.fov) { cam.fov = tune.fov; cam.updateProjectionMatrix(); }
  cam.position.set(x, y, z); cam.rotation.set(pitch, yaw, 0, 'YXZ'); cam.updateMatrixWorld(true);
  renderView(cam, 0, null, null, null, Zv.th, FULL);
}
function drawPlayerView() {
  const a = ALPHA;
  let x = lerp(P.px, P.x, a), y = lerp(P.pey, P.ey, a), z = lerp(P.pz, P.z, a), yaw = lerp(P.pyaw, P.yaw, a), Zv = P.Z;
  const t = P.cross;
  if (t && (x - t.x) * t.nx + (z - t.z) * t.nz <= 0.0005) { // between two steps the eye is still on the side it came from
    _v.set(x, y, z).applyMatrix4(t.M); x = _v.x; y = _v.y; z = _v.z; yaw += t.rot; Zv = t.target.Z;
  }
  draw3D(x, y, z, yaw, lerp(P.ppitch, P.pitch, a), Zv);
}

// ---- The HUD -------------------------------------------------------------------------------
function diamond(x, y, r, c) {
  ctx.fillStyle = c; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); ctx.fill(); ctx.stroke();
}
function hud() {
  const red = P.Z.th.life === 'red', y = H - 30;
  ctx.fillStyle = 'rgba(12,14,20,0.94)'; ctx.fillRect(0, H - 60, W, 60);
  ctx.fillStyle = red ? '#ff4d5e' : '#3fe0c5'; ctx.fillRect(0, H - 62, W, 3);
  text(`Space ${state.level} of ${LEVELS.length}: ${state.name}`, 28, y + 1, 20, '#ffffff', 'left', 'bold');
  diamond(W / 2 - 80, y, 10, red ? '#d22a3e' : '#58c86a');
  text(red ? 'Red life' : 'Colourful life', W / 2 - 60, y + 1, 20, '#ffffff', 'left', 'bold');
  text('E cube   R restart   P pause', W - 28, y + 1, 19, '#cfd6e0', 'right');
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(W / 2, (H - 60) / 2, 4, 0, PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(W / 2, (H - 60) / 2, 6, 0, PI * 2); ctx.stroke();
  const tip = state.prompt || (!locked && !CHEAP ? 'Click the game to look with the mouse' : '');
  if (tip) { panel(W / 2 - 210, 22, 420, 44, 12, 'rgba(12,14,20,0.82)'); text(tip, W / 2, 45, 21, '#ffffff'); }
  if (state.fade > 0) { ctx.fillStyle = `rgba(255,255,255,${state.fade})`; ctx.fillRect(0, 0, W, H); }
}
function backdrop(sway) { // the first garden, seen from where you will stand
  const s = L.start;
  draw3D(s.x, s.y + tune.eye_height, s.z, s.yaw + Math.sin(state.t * 0.35) * sway, -0.02, s.Z);
}

// ---- Scenes ---------------------------------------------------------------------------------
let scene, state = {};
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  // state.gained: what this run gained or learned, the high the ending shows.
  state = { t: 0, score: 0, gained: '', fade: 0, fadeDir: 0, done: false };
  if (params.get('scene') === 'figures') loadLevel('figures');
  else loadLevel(clamp((Number(params.get('level')) || 1) - 1, 0, LEVELS.length - 1));
}
function nextSpace() {
  if (L.index + 1 < LEVELS.length) { state.score = L.index + 1; loadLevel(L.index + 1); state.fadeDir = -1; return; }
  state.score = LEVELS.length; state.done = true; state.gained = 'You walked every seam'; state.fade = 0; state.fadeDir = 0;
  freeMouse(); scene = 'results';
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; stepWorld(0); },
    draw() {
      ctx.clearRect(0, 0, W, H); draw3D(0, 2.4, 8.6, 0, -0.1, L.zones[0]);
      _pm.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
      for (const l of L.labels) {
        _v.copy(l.p).applyMatrix4(_pm); const x = (_v.x * 0.5 + 0.5) * W, y = (-_v.y * 0.5 + 0.5) * H;
        panel(x - 68, y - 4, 136, 36, 10, 'rgba(12,14,20,0.85)'); text(l.s, x, y + 15, 21, '#ffffff', 'center', 'bold');
      }
    },
  },
  title: {
    update(dt) { state.t += dt; stepWorld(0); if (pressed('Enter') || pressed('Space')) { state.t = 0; scene = 'play'; } },
    draw() {
      ctx.clearRect(0, 0, W, H); backdrop(0.12);
      panel(W / 2 - 440, 70, 880, 560, 28, 'rgba(14,20,28,0.84)');
      text(TITLE, W / 2, 168, 104, '#ffffff', 'center', 'bold');
      ctx.fillStyle = '#3fe0c5'; ctx.fillRect(W / 2 - 150, 236, 150, 6); ctx.fillStyle = '#ff4d5e'; ctx.fillRect(W / 2, 236, 150, 6);
      text('one garden, two lives: every arch is a hole into the other', W / 2, 284, 25, '#ffeaa0');
      CONTROLS.forEach((c, i) => text(c, W / 2, 356 + i * 46, 24, '#ffffff'));
      text('Lost? R starts the space again. Nothing here can hurt you.', W / 2, 504, 22, '#cfd6e0');
      text('Click or press Enter to start', W / 2, 582, 30, '#ffe066', 'center', 'bold');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { freeMouse(); scene = 'pause'; return; }
      state.t += dt;
      if (state.fadeDir) {
        state.fade += state.fadeDir * dt / tune.fade_time;
        if (state.fadeDir > 0 && state.fade >= 1) { state.fade = 1; nextSpace(); if (scene !== 'play') return; }
        else if (state.fadeDir < 0 && state.fade <= 0) { state.fade = 0; state.fadeDir = 0; }
      }
      if (pressed('KeyR') && !state.won) { const f = state.fade; loadLevel(L.index); state.fade = f; events.push(['restart', state.level]); return; }
      stepPlayer(dt); interact(); stepWorld(dt); syncState();
    },
    draw() { ctx.clearRect(0, 0, W, H); drawPlayerView(); hud(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Enter')) { scene = 'play'; lockMouse(); } },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(8,10,16,0.55)'; ctx.fillRect(0, 0, W, H);
      text('Paused', W / 2, H / 2 - 30, 64, '#ffffff', 'center', 'bold');
      text('Click, or press P, to go on', W / 2, H / 2 + 36, 26, '#ffe066');
    },
  },
  results: {
    update(dt) { state.t += dt; stepWorld(0); if (pressed('Enter')) { reset(); scene = 'play'; lockMouse(); } },
    draw() {
      ctx.clearRect(0, 0, W, H); backdrop(0.5);
      panel(W / 2 - 400, 170, 800, 380, 28, 'rgba(14,20,28,0.86)');
      text(state.gained || 'The end', W / 2, 262, 60, '#ffffff', 'center', 'bold');
      ctx.fillStyle = '#3fe0c5'; ctx.fillRect(W / 2 - 150, 312, 150, 6); ctx.fillStyle = '#ff4d5e'; ctx.fillRect(W / 2, 312, 150, 6);
      text(`All ${LEVELS.length} spaces, both lives, and not one straight line home.`, W / 2, 372, 25, '#ffeaa0');
      text('Enter to walk it again', W / 2, 468, 28, '#ffe066', 'center', 'bold');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); renderer.setRenderTarget(null); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

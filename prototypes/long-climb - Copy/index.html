// ---- The tower: fifty levels, laid by one recipe per world from a fixed seed --------------------
// Each ledge sits within one jump of the one before: the sideways gap and the rise are drawn from

const PW = 30, PH = 38;

    draw() {
      drawWorld(); rr(40, 200, W - 80, 800, 30, 'rgba(12,14,22,0.9)', '#ffd44f', 5);
      text(K.summit, W / 2, 296, 60, '#ffd44f', 'center', true); text(K.modes[mode], W / 2, 360, 28, ['#7be08a', '#ffe58a', '#ff6a78'][mode], 'center', true);
      text(K.time, W / 2 + 190, 430, 26, '#cfd6e0'); text(clockText(state.cs || 0, true), W / 2 + 190, 484, 44, '#ffffff', 'center', true);
      text(K.falls, W / 2 - 40, 430, 26, '#cfd6e0'); text(String(state.falls), W / 2 - 40, 484, 44, '#ffffff', 'center', true);
      text(K.stars, W / 2 - 210, 430, 26, '#cfd6e0'); plain(state.stars + ' / ' + LEVELS, W / 2 - 210, 484, 44, '#ffffff');
      text(K.yourCode, W / 2, 586, 28, '#cfd6e0'); rr(W / 2 - 270, 618, 540, 90, 18, '#ffffff', '#ffd44f', 5); plain(state.code, W / 2, 665, 46, '#0c0e16');
      text(K.sendCode, W / 2, 756, 25, '#ffe58a');
      if (save.best[mode].cs) text(`${K.bestTime}: ${clockText(save.best[mode].cs, true)}`, W / 2, 814, 26, '#ffffff');
      text(K.again, W / 2, 916, 29, '#ffd44f', 'center', true);
    },
  },
  code: { // the streamer types a viewer's code to see their time against their own
    update(dt) {
      state.t += dt;
      if (pressed('Escape')) { scene = 'title'; return; }
      while (typed.length) { const k = typed.shift(); if (k === 'Backspace') state.entry = state.entry.slice(0, -1); else if (/^[a-zA-Z0-9-]$/.test(k) && state.entry.length < 18) { state.entry += k.toUpperCase(); sfx.type(); } state.verdict = null; }
      if (pressed('Enter') && state.entry) { const c = readCode(state.entry); state.verdict = c ? { ok: true, cs: c.cs, falls: c.falls, mode: c.mode } : { ok: false }; events.push(['code', !!c]); }
    },
    draw() {
      drawWorld(); rr(40, 200, W - 80, 760, 30, 'rgba(12,14,22,0.92)');
      text(K.codeTitle, W / 2, 290, 48, '#ffffff', 'center', true); text(K.codeAsk, W / 2, 356, 26, '#cfd6e0');
      rr(W / 2 - 270, 400, 540, 96, 18, '#ffffff', '#ffd44f', 5); plain(state.entry + (Math.floor(state.t * 2) % 2 ? '_' : ' '), W / 2, 450, 46, '#0c0e16');
      const v = state.verdict;
      if (v && !v.ok) text(K.codeBad, W / 2, 570, 40, '#ff6a78', 'center', true);
      if (v && v.ok) {
        const mine = save.best[v.mode].cs;
        text(`${K.codeOk}: ${K.modes[v.mode]}`, W / 2, 560, 34, '#7be08a', 'center', true);
        text(K.viewerTime, W / 2 + 150, 630, 26, '#cfd6e0'); text(clockText(v.cs, true), W / 2 + 150, 680, 44, '#ffffff', 'center', true);
        text(K.yourTime, W / 2 - 150, 630, 26, '#cfd6e0'); text(mine ? clockText(mine, true) : '-', W / 2 - 150, 680, 44, '#ffffff', 'center', true);
        text(`${K.falls}: ${v.falls}`, W / 2, 744, 26, '#cfd6e0');
        text(!mine ? K.noTime : v.cs < mine ? K.viewerWins : K.youWin, W / 2, 812, mine ? 40 : 27, '#ffd44f', 'center', true);
      }
      text(K.back, W / 2, 900, 26, '#cfd6e0');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM') && scene !== 'code') { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

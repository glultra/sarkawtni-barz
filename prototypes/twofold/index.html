<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Is crossing between two overlaid worlds to solve a room satisfying for ten minutes? -->
<!-- Date: 2026-11-15 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twofold</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script>
'use strict';

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
const TITLE = 'Twofold';
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { // rounded rectangle path
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
// Sounds are short note lists, played on the step clock: [delay s, Hz, length s, wave, volume]
const SFX = {
  cross: [[0, 330, 0.18, 'sine', 0.3], [0.07, 495, 0.22, 'sine', 0.25], [0.14, 660, 0.3, 'sine', 0.2]],
  bonk: [[0, 110, 0.12, 'square', 0.15]],
  pick: [[0, 520, 0.08, 'triangle', 0.25], [0.05, 700, 0.08, 'triangle', 0.2]],
  put: [[0, 300, 0.08, 'triangle', 0.25], [0.05, 200, 0.1, 'triangle', 0.25]],
  press: [[0, 180, 0.07, 'square', 0.15], [0.06, 880, 0.2, 'sine', 0.2]],
  release: [[0, 440, 0.12, 'sine', 0.12]],
  lit: [[0, 523, 0.25, 'sine', 0.3], [0.1, 659, 0.25, 'sine', 0.3], [0.2, 784, 0.25, 'sine', 0.3], [0.3, 1047, 0.5, 'sine', 0.3]],
  done: [[0, 784, 0.2, 'triangle', 0.25], [0.12, 1047, 0.4, 'triangle', 0.25]],
  undo: [[0, 400, 0.08, 'sine', 0.2], [0.05, 300, 0.1, 'sine', 0.2]],
  jump: [[0, 260, 0.08, 'sine', 0.12]],
};
function sfx(name) { for (const n of SFX[name]) state.sq.push({ at: state.t + n[0], n }); }

// ---- The two lives -------------------------------------------------------------------------
const T = 40, GW = 32, GH = 16, FLOOR = 13, PLAY_H = GH * T; // tiles; the floor's top is row 13
const DOOR_TOP = 8, DOOR_H = 5;                              // a door fills rows 8 to 12 under a pillar
const PAL = [
  { name: 'Colourful life', bg: '#dff3f5', far: '#c8e8ea', far2: '#b3dcde', ground: '#2f9c95', cap: '#7bd8c9',
    line: '#12343b', leg: '#12343b', body: '#ffffff', scarf: '#ff5a3c', eye: '#12343b', crate: '#ff9f43', crate2: '#ffd9a0',
    key: { y: '#f6c833', u: '#3f7fe0', g: '#58c04a' }, exit: '#fff3b0', exitOff: '#9bc7c9', ghost: '#12343b', glow: '#35e0cf' },
  { name: 'Red life', bg: '#140709', far: '#230a0e', far2: '#330d13', ground: '#b3202a', cap: '#ee4a4f',
    line: '#050102', leg: '#ff9c9c', body: '#ffd6d6', scarf: '#3fd0c0', eye: '#3a0a10', crate: '#e2555b', crate2: '#ffb0b0',
    key: { y: '#ffb347', u: '#ff5fa2', g: '#ffe3e3' }, exit: '#ffd0d0', exitOff: '#4a1219', ghost: '#ff9c9c', glow: '#ff3b4a' },
];

// A portal is a seam on the floor: floor on its far side is reached only in the other life.
// Tile x positions; everything stands on the floor unless a level says otherwise.
function l3Sink(life, tx, ty) { // the part of room 3 the bridge drops into, with no way back
  return (life === 0 && tx > 10 && tx < 25) || (life === 1 && tx > 25) || (life === 1 && tx < 10 && ty >= 9);
}
const LEVELS = [
  { name: 'A wall here, none there', start: { x: 3, life: 0 }, portals: [9, 23], exit: { x: 28, life: 0 },
    solidA: [[15, 5, 2, 8]], solidB: [[16, 12, 1, 1]], blocks: [], switches: [], doors: [] },
  { name: 'Something to carry', start: { x: 2, life: 0 }, portals: [8], exit: { x: 27, life: 1 },
    blocks: [{ x: 12, life: 1 }], switches: [{ x: 4, life: 0, c: 'y' }], doors: [{ x: 20, life: 1, c: 'y' }] },
  { name: 'The long way round', start: { x: 28, life: 0, face: -1 }, portals: [10, 25], exit: { x: 22, life: 0 },
    solidB: [[7, 8, 9, 1], [16, 9, 1, 4], [17, 10, 1, 3], [18, 11, 1, 2], [19, 12, 1, 1]],
    blocks: [{ x: 22, life: 1 }], switches: [{ x: 14, life: 0, c: 'y' }], doors: [{ x: 19, life: 0, c: 'y' }],
    stuck: s => s.p.carry < 0 && l3Sink(s.p.life, Math.floor((s.p.x + s.p.w / 2) / T), Math.floor(s.p.y / T)) &&
      !l3Sink(s.blocks[0].life, Math.round(s.blocks[0].x / T), Math.round(s.blocks[0].y / T)) },
  { name: 'A step up', start: { x: 3, life: 0 }, portals: [9, 21], exit: { x: 29, life: 0 },
    solidB: [[16, 11, 1, 2], [17, 12, 1, 1]],
    blocks: [{ x: 6, life: 0 }, { x: 12, life: 1 }], switches: [{ x: 23, life: 0, c: 'u' }], doors: [{ x: 28, life: 0, c: 'u' }] },
  { name: 'Both lives at once', start: { x: 2, life: 0 }, portals: [7, 18], exit: { x: 28, life: 0 },
    blocks: [{ x: 9, life: 1 }, { x: 21, life: 0 }],
    switches: [{ x: 4, life: 0, c: 'y' }, { x: 14, life: 1, c: 'g' }],
    doors: [{ x: 11, life: 1, c: 'y' }, { x: 25, life: 0, c: 'g' }] },
];

function buildLevel(i) {
  const d = LEVELS[i];
  const grid = [0, 1].map(() => Array.from({ length: GH }, () => Array(GW).fill(false)));
  const fill = (life, [x, y, w, h]) => {
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++)
      if (yy >= 0 && yy < GH && xx >= 0 && xx < GW) grid[life][yy][xx] = true;
  };
  for (const life of [0, 1]) { fill(life, [0, FLOOR, GW, GH - FLOOR]); fill(life, [0, 0, 1, GH]); fill(life, [GW - 1, 0, 1, GH]); }
  // Out of reach, so the two lives never look like one room recoloured: islands above, roots hanging.
  fill(0, [(5 + i * 5) % 22 + 3, 2, 3, 1]); fill(0, [(16 + i * 7) % 22 + 3, 3, 2, 1]);
  for (let k = 0; k < 5; k++) fill(1, [2 + k * 6 + (i % 3), 0, 1, 2 + ((k + i) % 3)]);
  (d.solidA || []).forEach(r => fill(0, r)); (d.solidB || []).forEach(r => fill(1, r));
  const doors = d.doors.map(o => { fill(o.life, [o.x, 0, 1, DOOR_TOP]); return { tx: o.x, life: o.life, c: o.c, o: 0 }; });
  return {
    def: d, grid, doors,
    portals: d.portals.map(x => (x + 0.5) * T),
    exit: { tx: d.exit.x, life: d.exit.life },
    switches: d.switches.map(s => ({ tx: s.x, life: s.life, c: s.c, on: false })),
  };
}

// ---- Scenes ---------------------------------------------------------------------------------
let scene, state;
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = { t: 0, score: 0, gained: '', crossings: 0, undos: 0, sq: [] };
  loadLevel(Math.max(0, Math.min(LEVELS.length - 1, (Number(params.get('level')) || 1) - 1)));
}
function loadLevel(i) {
  const L = buildLevel(i), d = L.def;
  state.li = i; state.L = L; state.score = i;
  state.p = { x: d.start.x * T + 8, y: FLOOR * T - 34, w: 24, h: 34, vy: 0, life: d.start.life, face: d.start.face || 1,
    ground: true, carry: -1, coyote: 0, buffer: 0, walk: 0, moving: false };
  state.blocks = d.blocks.map(b => ({ x: b.x * T, y: (FLOOR - 1) * T, vy: 0, life: b.life, origin: b.life, carried: false }));
  state.undo = []; state.first = snap(); state.wipe = null; state.doneT = 0; state.idle = 0;
  state.lit = false; state.litT = 0; state.bonkT = 0; state.scarf = null;
  updateSwitches(true);
}
function snap() {
  const p = state.p;
  return { p: { x: p.x, y: p.y, vy: p.vy, life: p.life, face: p.face, carry: p.carry },
    b: state.blocks.map(b => ({ x: b.x, y: b.y, vy: b.vy, life: b.life, carried: b.carried })) };
}
function pushUndo(s) {
  state.undo.push(s || snap()); state.idle = 0;
  while (state.undo.length > tune.undo_cap) state.undo.shift();
}
function restore(s) {
  Object.assign(state.p, s.p); state.p.coyote = 0; state.p.buffer = 0;
  state.blocks.forEach((b, i) => Object.assign(b, s.b[i]));
  state.wipe = null; state.scarf = null; state.idle = 0;
  updateSwitches(true);
}

// Solid things in one life: its tiles, its closed doors, its crates on the ground.
function tileSolid(life, tx, ty) {
  if (tx < 0 || tx >= GW) return true;
  if (ty < 0 || ty >= GH) return false;
  return state.L.grid[life][ty][tx];
}
function overlap(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }
function rectHits(life, x, y, w, h, skip) {
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.001) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.001) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(life, tx, ty)) return true;
  for (const d of state.L.doors)
    if (d.life === life && d.o < 1 && overlap(x, y, w, h, d.tx * T, DOOR_TOP * T, T, DOOR_H * T * (1 - d.o))) return true;
  for (const b of state.blocks)
    if (b !== skip && b.life === life && !b.carried && overlap(x, y, w, h, b.x, b.y, T, T)) return true;
  return false;
}
function slide(obj, w, h, dx, dy, skip) { // move up to a pixel at a time; false when something stops it
  const s = Math.sign(dx || dy); let rem = Math.abs(dx || dy);
  while (rem > 0) {
    const st = Math.min(1, rem) * s, nx = obj.x + (dx ? st : 0), ny = obj.y + (dy ? st : 0);
    if (rectHits(obj.life, nx, ny, w, h, skip)) return false;
    obj.x = nx; obj.y = ny; rem -= Math.abs(st);
  }
  return true;
}

function updateSwitches(instant) {
  const p = state.p, floorY = FLOOR * T;
  for (const s of state.L.switches) {
    const x0 = s.tx * T, x1 = x0 + 2 * T, pc = p.x + p.w / 2;
    let on = p.life === s.life && p.ground && Math.abs(p.y + p.h - floorY) < 2 && pc > x0 && pc < x1;
    for (const b of state.blocks)
      if (b.life === s.life && !b.carried && Math.abs(b.y + T - floorY) < 2 && b.x + T / 2 > x0 && b.x + T / 2 < x1) on = true;
    if (on !== s.on && !instant) sfx(on ? 'press' : 'release');
    s.on = on;
  }
  for (const d of state.L.doors) {
    let want = state.L.switches.some(s => s.c === d.c && s.on) ? 1 : 0;
    if (!want && d.o > 0) { // never closes on the walker or a crate
      const x = d.tx * T, y = DOOR_TOP * T;
      if (p.life === d.life && overlap(p.x, p.y, p.w, p.h, x, y, T, DOOR_H * T)) want = d.o;
      for (const b of state.blocks) if (b.life === d.life && !b.carried && overlap(b.x, b.y, T, T, x, y, T, DOOR_H * T)) want = d.o;
    }
    if (instant) d.o = want;
    else if (d.o < want) d.o = Math.min(want, d.o + tune.door_open_speed * STEP);
    else if (d.o > want) d.o = Math.max(want, d.o - tune.door_close_speed * STEP);
  }
}

// The exit lights when the walker could walk to it: a flood over cells with footing near below.
function exitReachable() {
  const p = state.p, e = state.L.exit, life = e.life;
  if (p.life !== life) return false;
  const solid = (x, y) => x < 0 || x >= GW || y < 0 || y >= GH || state.L.grid[life][y][x] ||
    state.L.doors.some(d => d.life === life && d.o < 0.5 && d.tx === x && y >= DOOR_TOP && y < DOOR_TOP + DOOR_H) ||
    state.blocks.some(b => b.life === life && !b.carried && Math.round(b.x / T) === x && Math.round(b.y / T) === y) ||
    (y >= FLOOR - tune.portal_tall && state.L.portals.some(px => Math.floor(px / T) === x)); // a seam is not this life's floor
  const ok = (x, y) => !solid(x, y) && (solid(x, y + 1) || solid(x, y + 2));
  const sx = Math.floor((p.x + p.w / 2) / T), sy = Math.floor((p.y + p.h - 1) / T);
  if (!ok(sx, sy)) return state.lit;
  const seen = new Set([sx + sy * GW]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.pop();
    if (x === e.tx && y === FLOOR - 1) return true;
    for (const [ax, ay] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]])
      if (!seen.has(ax + ay * GW) && ok(ax, ay)) { seen.add(ax + ay * GW); q.push([ax, ay]); }
  }
  return false;
}

function tryCarry() {
  const p = state.p, pc = p.x + p.w / 2;
  if (!p.ground) return;
  if (p.carry >= 0) { // put down in the tile ahead
    const b = state.blocks[p.carry], col = Math.floor(pc / T) + p.face, row = Math.floor((p.y + p.h - 1) / T);
    let ok = col > 0 && col < GW - 1 && !rectHits(p.life, col * T + 1, row * T + 1, T - 2, T - 2);
    if (state.L.portals.some(px => Math.floor(px / T) === col)) ok = false;       // never on a seam
    if (state.L.doors.some(d => d.life === p.life && d.tx === col)) ok = false;     // never in a doorway
    let footing = false;
    for (let y = row + 1; y < GH && !footing; y++) footing = rectHits(p.life, col * T + 1, y * T + 1, T - 2, T - 2);
    if (!footing) ok = false;
    let nx = p.x;
    if (ok && overlap(p.x, p.y, p.w, p.h, col * T, row * T, T, T)) { // make room
      nx = p.face > 0 ? col * T - p.w - 0.01 : (col + 1) * T + 0.01;
      if (rectHits(p.life, nx, p.y, p.w, p.h)) ok = false;
    }
    if (!ok) { sfx('bonk'); return; }
    pushUndo(); p.x = nx;
    b.carried = false; b.x = col * T; b.y = row * T; b.vy = 0; b.life = p.life; p.carry = -1; sfx('put');
    return;
  }
  const i = reachable();
  if (i >= 0) { pushUndo(); state.blocks[i].carried = true; p.carry = i; sfx('pick'); }
}
function reachable() { // the crate the walker could pick up now, or -1
  const p = state.p, pc = p.x + p.w / 2, py = p.y + p.h / 2;
  let best = -1, bd = 1e9;
  if (p.carry >= 0 || !p.ground) return -1;
  state.blocks.forEach((b, i) => {
    if (b.life !== p.life || b.carried) return;
    const dx = b.x + T / 2 - pc, dy = b.y + T / 2 - py;
    if (Math.abs(dx) > tune.pickup_reach * T || Math.abs(dy) > 0.9 * T) return;
    const score = Math.abs(dx) + (Math.sign(dx) === p.face ? 0 : T); // the one faced first
    if (score < bd) { bd = score; best = i; }
  });
  return best;
}

function updateScarf() {
  const p = state.p, nx = p.x + p.w / 2 - p.face * 9, ny = p.y + 13;
  if (!state.scarf) state.scarf = Array.from({ length: 6 }, (_, i) => ({ x: nx - p.face * i * 5, y: ny + i * 2 }));
  const s = state.scarf; s[0].x = nx; s[0].y = ny;
  for (let i = 1; i < s.length; i++) {
    const tx = s[i - 1].x - p.face * 5, ty = s[i - 1].y + 2.5 + Math.sin(state.t * 9 + i) * (p.moving ? 1.5 : 0.4);
    s[i].x += (tx - s[i].x) * 0.35; s[i].y += (ty - s[i].y) * 0.35;
  }
}

function updatePlay(dt) {
  const p = state.p, L = state.L;
  state.t += dt;
  for (let i = state.sq.length - 1; i >= 0; i--)
    if (state.sq[i].at <= state.t) { const n = state.sq[i].n; tone(n[1], n[2], n[3], n[4]); state.sq.splice(i, 1); }
  if (state.wipe) { state.wipe.t += dt; if (state.wipe.t >= tune.wipe_s) state.wipe = null; }
  if (state.lit) state.litT += dt;
  state.bonkT = Math.max(0, state.bonkT - dt);
  if (state.doneT > 0) { // on the lit exit: a beat, then the next room
    state.doneT -= dt; updateScarf();
    if (state.doneT <= 0) {
      if (state.li + 1 < LEVELS.length) loadLevel(state.li + 1);
      else { state.score = LEVELS.length; state.gained = 'You walked both lives'; scene = 'results'; }
    }
    return;
  }
  state.idle += dt;

  if (pressed('KeyZ') && state.undo.length) { restore(state.undo.pop()); state.undos++; sfx('undo'); return; }
  if (pressed('KeyR')) { pushUndo(); restore(state.first); sfx('undo'); return; }
  if (pressed('KeyE')) tryCarry();

  // Walk
  const dir = (down.has('ArrowRight') || down.has('KeyD') ? 1 : 0) - (down.has('ArrowLeft') || down.has('KeyA') ? 1 : 0);
  p.moving = dir !== 0;
  if (dir) { p.face = dir; p.walk += dt * 12; }
  const oldX = p.x, c0 = p.x + p.w / 2;
  if (dir) slide(p, p.w, p.h, dir * tune.move_speed * dt, 0);
  // Cross a seam: the middle of the walker passes the portal's line
  const c1 = p.x + p.w / 2, base = FLOOR * T;
  for (const px of L.portals) {
    if (p.y + p.h <= base - tune.portal_tall * T || p.y >= base) continue;
    const to = c0 < px && c1 >= px ? 1 : c0 > px && c1 <= px ? -1 : 0;
    if (!to) continue;
    const nx = px + to * Math.max(Math.abs(c1 - px), 0.5) - p.w / 2, other = 1 - p.life;
    if (rectHits(other, nx, p.y, p.w, p.h)) { // the other life is solid here
      p.x = oldX; if (!state.bonkT) { sfx('bonk'); state.bonkT = 0.4; }
    } else {
      p.x = oldX; pushUndo(); p.x = nx;
      state.wipe = { x: px, y: p.y + p.h / 2, t: 0, from: p.life };
      p.life = other; if (p.carry >= 0) state.blocks[p.carry].life = other;
      state.crossings++; sfx('cross'); events.push({ type: 'cross', life: other, t: state.t });
    }
    break;
  }

  // Jump and fall
  p.coyote = p.ground ? tune.coyote_s : Math.max(0, p.coyote - dt);
  p.buffer = pressed('Space') || pressed('ArrowUp') || pressed('KeyW') ? tune.jump_buffer_s : Math.max(0, p.buffer - dt);
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -Math.sqrt(2 * tune.gravity * tune.jump_height * T); p.buffer = 0; p.coyote = 0; sfx('jump');
  }
  p.vy = Math.min(p.vy + tune.gravity * dt, 1400);
  p.ground = false;
  if (!slide(p, p.w, p.h, 0, p.vy * dt)) { if (p.vy > 0) p.ground = true; p.vy = 0; }
  if (p.y > PLAY_H + 200) restore(state.undo.length ? state.undo[state.undo.length - 1] : state.first); // fell out: back, nothing lost

  // Crates fall; a carried one rides overhead
  state.blocks.forEach(b => {
    if (b.carried) { b.x = p.x + p.w / 2 - T / 2; b.y = p.y - T + 2; b.vy = 0; return; }
    b.vy = Math.min(b.vy + tune.gravity * dt, 1400);
    if (!slide(b, T, T, 0, b.vy * dt, b)) b.vy = 0;

  updateSwitches(false);
  const lit = exitReachable();
  if (lit && !state.lit) { sfx('lit'); state.litT = 0; events.push({ type: 'lit', t: state.t }); }
  state.lit = lit;
  if (p.life === L.exit.life && overlap(p.x, p.y, p.w, p.h, L.exit.tx * T + 6, (FLOOR - 2) * T, T - 12, 2 * T)) {
    state.doneT = tune.level_done_s; state.lit = true; sfx('done'); events.push({ type: 'solved', level: state.li + 1, t: state.t });
  }

}

function drawLife(life) { // one whole life, as it is now, without the walker

}

  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() {
      drawPlay(); ctx.fillStyle = 'rgba(12,14,18,0.8)'; ctx.fillRect(0, 0, W, PLAY_H);
      text('Paused', W / 2, PLAY_H / 2 - 20, 56, '#ffffff', 'center', 'bold'); text('P to carry on', W / 2, PLAY_H / 2 + 40, 26, '#c9d2dc');
    },
  },
  results: {
    update(dt) { state.t += dt; if (pressed('Enter')) { params.delete('level'); reset(); scene = 'play'; } },
    draw() {
      drawPlay(); ctx.fillStyle = 'rgba(12,14,18,0.86)'; ctx.fillRect(0, 0, W, H);
      drawWalker(W / 2 - 40, 200, 1, 0, false, false, PAL[0], null, PAL[0].scarf); drawWalker(W / 2 + 40, 200, -1, 0, false, false, PAL[1], null, PAL[1].scarf);
      text(state.gained || 'You walked both lives', W / 2, 290, 56, '#ffffff', 'center', 'bold');
      text(`All ${LEVELS.length} rooms solved`, W / 2, 370, 28, '#fff6d8');
      text(`${state.crossings} crossings between lives, ${state.undos} moves taken back`, W / 2, 420, 24, '#c9d2dc');
      text('Enter to play again', W / 2, 520, 28, '#ffffff', 'center', 'bold');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
